          description: "Python 월간 view가 표시하는 1부터 12까지의 월입니다."
    WeeklyRecapResponse:
      type: object
      additionalProperties: false
      required: [kind, status, period, generationVersion, schemaVersion, algorithmVersion, generatedAt, result]
      properties:
        kind:
          type: string
          const: WEEKLY
          description: "이 리소스가 완료된 주간 리캡임을 나타내는 고정 판별자입니다."
        status:
          type: string
          enum: [NOT_GENERATED, GENERATING, FAILED, SUCCEEDED]
          description: "사용 가능한 current 성공을 우선한 주간 공개 생성 상태입니다. SUPERSEDED는 노출하지 않습니다."
        period:
          $ref: '#/components/schemas/RecapPeriod'
          description: "요청에서 선택된 완료 주의 반개구간 Asia/Seoul 날짜 경계입니다."
        generationVersion:
          description: "논리 주간 기간의 단조 증가 생성 버전이며 생성 이력이 없으면 null입니다."
          oneOf:
            - {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
            - {type: "null"}
        schemaVersion:
          type: integer
          const: 1
          description: "이 공개 응답과 저장 view를 해석하는 고정 스키마 버전입니다."
        algorithmVersion:
          description: "생성 행이 결속한 고정 알고리즘 버전이며 생성 이력이 없으면 null입니다."
          oneOf:
            - {type: string, const: recap-1}
            - {type: "null"}
        generatedAt:
          description: "current 성공 결과를 영속 저장한 UTC 시점이며 성공 결과가 없으면 null입니다."
          oneOf:
            - {$ref: '#/components/schemas/UtcInstant'}
            - {type: "null"}
        result:
          description: "SUCCEEDED일 때만 존재하는 불변 주간 view이며 활동 0도 null 대신 이 객체로 표현합니다."
          oneOf:
            - {$ref: '#/components/schemas/WeeklyRecapResult'}
            - {type: "null"}
      allOf:
        - if:
            properties: {status: {const: NOT_GENERATED}}
            required: [status]
          then:
            properties:
              generationVersion: {type: "null"}
              algorithmVersion: {type: "null"}
              generatedAt: {type: "null"}
              result: {type: "null"}
        - if:
            properties: {status: {enum: [GENERATING, FAILED]}}
            required: [status]
          then:
            properties:
              generationVersion: {type: integer, minimum: 1, maximum: 9007199254740991}
              algorithmVersion: {type: string, const: recap-1}
              generatedAt: {type: "null"}
              result: {type: "null"}
        - if:
            properties: {status: {const: SUCCEEDED}}
            required: [status]
          then:
            properties:
              generationVersion: {type: integer, minimum: 1, maximum: 9007199254740991}
              algorithmVersion: {type: string, const: recap-1}
              generatedAt: {$ref: '#/components/schemas/UtcInstant'}
              result: {$ref: '#/components/schemas/WeeklyRecapResult'}
    MonthlyRecapResponse:
      type: object
      additionalProperties: false
      required: [kind, status, period, generationVersion, schemaVersion, algorithmVersion, generatedAt, result]
      properties:
        kind:
