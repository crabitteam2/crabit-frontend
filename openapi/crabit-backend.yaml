        wishPurposeSnapshot: {$ref: '#/components/schemas/Purpose', description: "완료 시 원장 효과에 의해 이 위시에 대해 포착된 불변의 목적입니다."}
        wishAmountDelta:
          description: "이 위시에서 반환된 음수 정수 KRW입니다. 반환액이 0이면 이벤트나 이력 항목을 만들지 않습니다."
          allOf: [{$ref: '#/components/schemas/KrwSigned'}, {maximum: -1}]
        wishAmountAfter: {type: integer, const: 0, description: "명시적 완료 후에는 항상 0 KRW입니다."}
