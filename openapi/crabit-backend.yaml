        representativeWishTitle: {type: [string, "null"], maxLength: 200, description: "생성 snapshot의 대표 위시 제목이며 대표 위시가 없으면 null입니다."}
        prevRatePct: {type: [integer, "null"], minimum: -9007199254740991, maximum: 9007199254740991, description: "대표 위시의 이전 월말 달성률이며 대표 위시가 없으면 null입니다."}
        currRatePct: {type: [integer, "null"], minimum: -9007199254740991, maximum: 9007199254740991, description: "대표 위시의 완료 월말 달성률이며 대표 위시가 없으면 null입니다."}
        messageTotalSavings: {type: string, minLength: 1, maxLength: 1000, description: "완료 월의 총 순저축액을 설명하는 결정적 문구입니다."}
        messageCompletedCount: {type: string, minLength: 1, maxLength: 1000, description: "완료 월의 위시 완료 수를 설명하는 결정적 문구입니다."}
        messageRateChange: {type: [string, "null"], minLength: 1, maxLength: 1000, description: "대표 위시 달성률 변화를 설명하며 대표 위시가 없으면 null입니다."}
