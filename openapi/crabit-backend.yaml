          description: "외부 카드 변경 및 모든 위시 이동을 포함하여 occurredAt 내림차순, eventId 내림차순의 불변 원장 이벤트당 하나의 항목입니다."
          type: array
          items: {$ref: '#/components/schemas/AccountFundMovement'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "다른 항목이 존재할 때 최종 반환된 (occurredAt, eventId) 튜플에서 파생된 불투명 커서입니다. 빈 페이지와 종결 상태 페이지의 경우 null입니다."}
    WishFundMovement:
