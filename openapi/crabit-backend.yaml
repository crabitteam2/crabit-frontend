        - "period"
        - "asOf"
        - "coverage"
        - "studentId"
        - "authorStudentId"
        - "profileVisitCount"
        - "daily"
      properties:
        schemaVersion:
          type: "integer"
          description: "내부 지표 계약 버전입니다."
          const: 1
        academyId:
          $ref: "#/components/schemas/Uuid"
          description: "조회 대상 학원 UUID입니다."
        period:
          $ref: "#/components/schemas/BehaviorMetricPeriod"
          description: "조회한 서울 날짜 반개구간입니다."
        asOf:
          $ref: "#/components/schemas/UtcInstant"
          description: "발생 시각 상한과 보존 판정에 쓰는 한 번의 일관된 조회 시각입니다."
        coverage:
          $ref: "#/components/schemas/BehaviorMetricCoverage"
          description: "수집 가능성과 논리 보존 상태를 수치와 함께 해석합니다."
        studentId:
          $ref: "#/components/schemas/Uuid"
          description: "관심을 보낸 현재 학원 학생 UUID입니다."
        authorStudentId:
          $ref: "#/components/schemas/Uuid"
          description: "관심 대상 작성자의 학생 UUID입니다."
        profileVisitCount:
          type:
            - "integer"
            - "null"
          description: "studentId에서 authorStudentId로 향한 방문 수이며 NONE이면 null입니다."
          format: "int64"
          minimum: 0
        daily:
          type: "array"
          description: "요청한 모든 날짜의 오름차순 작성자 방문 지표입니다."
          items:
            $ref: "#/components/schemas/BehaviorAuthorInterestDaily"
          minItems: 1
          maxItems: 90
      allOf:
        - if:
            properties:
              coverage:
                properties:
                  status:
                    const: "NONE"
          then:
            properties:
              profileVisitCount:
                type: "null"
          else:
            properties:
              profileVisitCount:
                type: "integer"
    BehaviorFeedMetricItem:
      type: "object"
      additionalProperties: false
      description: "actor/impression과 불변 맥락·카드·위치로 결합합니다. 여러 클릭은 클릭 수만 늘리고 CTR 분자는 한 번만 늘립니다."
      required:
        - "sortSource"
        - "position"
        - "exposureCount"
        - "clickCount"
        - "clickedExposedImpressionCount"
        - "unmatchedClickCount"
        - "ctr"
      properties:
        sortSource:
          type: "string"
          description: "서버가 기록한 정렬 출처입니다."
          const: "LATEST"
        position:
          type: "integer"
          description: "결과 페이지 안의 0부터 시작하는 카드 위치입니다."
          minimum: 0
          maximum: 99
        exposureCount:
          type: "integer"
          description: "유효한 고유 actor/impression 노출 수입니다."
          format: "int64"
          minimum: 0
        clickCount:
          type: "integer"
          description: "유효한 AUTHOR_PROFILE 클릭 이벤트 수입니다."
          format: "int64"
          minimum: 0
        clickedExposedImpressionCount:
          type: "integer"
          description: "기간 내 유효한 노출과 하나 이상 클릭이 함께 있는 고유 actor/impression 수입니다."
          format: "int64"
          minimum: 0
        unmatchedClickCount:
          type: "integer"
          description: "요청 기간 안의 유효한 대응 노출이 없는 클릭 이벤트 수입니다."
          format: "int64"
          minimum: 0
        ctr:
          type:
            - "number"
            - "null"
          description: "노출이 0이면 null, 아니면 clickedExposedImpressionCount / exposureCount입니다."
          minimum: 0
          maximum: 1
      allOf:
        - if:
            properties:
              exposureCount:
                const: 0
          then:
            properties:
              ctr:
                type: "null"
          else:
            properties:
              ctr:
                type: "number"
    BehaviorFeedMetrics:
