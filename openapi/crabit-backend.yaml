          $ref: "#/components/schemas/UtcInstant"
          description: "마이크로초로 절삭한 최초 발생 시각이며 재생에도 그대로 유지합니다."
        receivedAt:
          $ref: "#/components/schemas/UtcInstant"
          description: "최초 수신 시각이며 재생에도 그대로 유지합니다."
    FeedResultRequest:
      type: "object"
      additionalProperties: false
      description: "기존 공유 카드 커서와 정렬을 사용합니다. actor나 추천 출처를 클라이언트가 지정할 수 없습니다."
      required: []
      properties:
        cursor:
          $ref: "#/components/schemas/Cursor"
          description: "첫 페이지에는 생략합니다. 명시적인 null 또는 빈 값은 허용하지 않습니다."
        limit:
          type: "integer"
          description: "페이지 크기이며 기본값은 20입니다."
          minimum: 1
          maximum: 100
          default: 20
    FeedResultResponse:
      type: "object"
      additionalProperties: false
      description: "actor, 학원, 실제 카드와 위치, 생성 시각을 저장한 페이지입니다. 맥락 생성 자체는 노출·클릭·방문을 기록하지 않습니다."
      required:
        - "resultContextId"
        - "createdAt"
        - "expiresAt"
        - "sortSource"
        - "recommendationResultId"
        - "modelVersion"
        - "items"
        - "nextCursor"
      properties:
        resultContextId:
          $ref: "#/components/schemas/Uuid"
          description: "서버가 생성한 결과 맥락 UUID입니다."
        createdAt:
          $ref: "#/components/schemas/UtcInstant"
          description: "맥락 생성 시각입니다."
        expiresAt:
          $ref: "#/components/schemas/UtcInstant"
          description: "createdAt에서 정확히 24시간 뒤입니다."
        sortSource:
          type: "string"
          description: "서버가 결정한 최신순 정렬 출처입니다."
          const: "LATEST"
        recommendationResultId:
          type: "null"
          description: "최신순 페이지에는 추천 결과 식별자가 없습니다."
        modelVersion:
          type: "null"
          description: "최신순 페이지에는 추천 모델 버전이 없습니다."
        items:
          type: "array"
          description: "실제로 전달한 순서의 기존 공유 카드입니다. 배열 인덱스가 position이며 빈 페이지도 맥락을 생성합니다."
          items:
            $ref: "#/components/schemas/SharedCard"
          maxItems: 100
        nextCursor:
          type:
            - "string"
            - "null"
          description: "기존 공유 카드 커서입니다. 마지막 페이지는 null입니다."
          minLength: 1
    BehaviorFeedExposureRequest:
      type: "object"
      additionalProperties: false
      description: "문서가 보이는 동안 카드가 50% 이상 연속 1000ms 보인 주기당 하나의 노출입니다. clickKind는 금지됩니다."
      required:
        - "eventId"
        - "eventType"
        - "occurredAt"
        - "resultContextId"
        - "cardId"
        - "position"
        - "impressionId"
      properties:
        eventId:
          $ref: "#/components/schemas/Uuid"
          description: "인증 학생별 이벤트 UUID입니다."
        eventType:
          type: "string"
          description: "피드 노출 이벤트입니다."
          const: "FEED_EXPOSURE"
        occurredAt:
          $ref: "#/components/schemas/UtcInstant"
          description: "실제 행동 시각이며 마이크로초 아래 정밀도는 절삭합니다."
        resultContextId:
          $ref: "#/components/schemas/Uuid"
          description: "본인과 현재 학원에 속한 결과 맥락 UUID입니다."
        cardId:
          $ref: "#/components/schemas/Uuid"
          description: "해당 맥락에 실제 기록된 카드 UUID입니다."
        position:
          type: "integer"
          description: "결과 페이지 안의 0부터 시작하는 카드 위치입니다."
          minimum: 0
          maximum: 99
        impressionId:
          $ref: "#/components/schemas/Uuid"
          description: "학생 범위에서 맥락·카드·위치에 불변 결속되는 가시성 주기 UUID입니다."
    BehaviorFeedClickRequest:
      type: "object"
      additionalProperties: false
      description: "노출보다 먼저 또는 노출 없이 발생한 클릭도 수락하며 노출을 합성하지 않습니다."
      required:
        - "eventId"
        - "eventType"
        - "occurredAt"
        - "resultContextId"
        - "cardId"
        - "position"
        - "impressionId"
        - "clickKind"
      properties:
        eventId:
          $ref: "#/components/schemas/Uuid"
          description: "인증 학생별 이벤트 UUID입니다."
        eventType:
          type: "string"
          description: "피드 클릭 이벤트입니다."
          const: "FEED_CLICK"
        occurredAt:
          $ref: "#/components/schemas/UtcInstant"
          description: "실제 행동 시각이며 마이크로초 아래 정밀도는 절삭합니다."
        resultContextId:
          $ref: "#/components/schemas/Uuid"
          description: "본인과 현재 학원에 속한 결과 맥락 UUID입니다."
        cardId:
          $ref: "#/components/schemas/Uuid"
          description: "해당 맥락에 실제 기록된 카드 UUID입니다."
        position:
          type: "integer"
          description: "결과 페이지 안의 0부터 시작하는 카드 위치입니다."
          minimum: 0
          maximum: 99
        impressionId:
          $ref: "#/components/schemas/Uuid"
          description: "학생 범위에서 맥락·카드·위치에 불변 결속되는 가시성 주기 UUID입니다."
        clickKind:
          type: "string"
          description: "기존 방문하기 동작입니다. 도착 프로필의 방문 기록은 별도 이벤트입니다."
          const: "AUTHOR_PROFILE"
    BehaviorFeedEventRequest:
      description: "eventType에 맞는 닫힌 요청 하나만 허용하며 알 수 없는 필드와 null을 거부합니다."
      oneOf:
        - $ref: "#/components/schemas/BehaviorFeedExposureRequest"
        - $ref: "#/components/schemas/BehaviorFeedClickRequest"
      discriminator:
        propertyName: "eventType"
        mapping:
          FEED_EXPOSURE: "#/components/schemas/BehaviorFeedExposureRequest"
          FEED_CLICK: "#/components/schemas/BehaviorFeedClickRequest"
    BehaviorMetricPeriod:
      type: "object"
      additionalProperties: false
      description: "양의 기간이며 최대 90일, 종료일은 서울 기준 내일을 넘지 않습니다."
      required:
        - "fromDate"
        - "toDate"
        - "timezone"
        - "fromInclusive"
        - "toExclusive"
      properties:
        fromDate:
          $ref: "#/components/schemas/UtcDate"
          description: "서울 기준 포함 시작일입니다."
        toDate:
          $ref: "#/components/schemas/UtcDate"
          description: "서울 기준 제외 종료일입니다."
        timezone:
          type: "string"
          description: "날짜 경계에 적용하는 시간대입니다."
          const: "Asia/Seoul"
        fromInclusive:
          $ref: "#/components/schemas/UtcInstant"
          description: "시작일 서울 자정에 해당하는 UTC 시각입니다."
        toExclusive:
          $ref: "#/components/schemas/UtcInstant"
          description: "종료일 서울 자정에 해당하는 UTC 시각입니다."
    BehaviorMetricCoverage:
      type: "object"
      additionalProperties: false
      description: "COMPLETE도 모든 클라이언트 활동 전달을 보장하지 않습니다. NONE은 알려진 범위와 겹치지 않고 기여 이벤트도 없는 경우입니다. 일부 보존 이벤트가 있으면 PARTIAL로 계산합니다."
      required:
        - "status"
        - "collectionStartedAt"
        - "retentionCutoffReceivedAt"
        - "fullyRetainedFrom"
        - "availableThrough"
        - "reasons"
        - "countsMeaning"
      properties:
        status:
          type: "string"
          description: "해당 기간의 수집 및 논리 보존 범위입니다."
          enum:
            - "COMPLETE"
            - "PARTIAL"
            - "NONE"
        collectionStartedAt:
          $ref: "#/components/schemas/UtcInstant"
          description: "최초 이벤트가 아닌 영속적인 백엔드 수집 활성화 시각이며 재시작으로 초기화하지 않습니다."
        retentionCutoffReceivedAt:
          $ref: "#/components/schemas/UtcInstant"
          description: "일관된 asOf에서 90일을 뺀 값입니다. 이 시각 이하에 수신한 이벤트는 제외합니다."
        fullyRetainedFrom:
          $ref: "#/components/schemas/UtcInstant"
          description: "collectionStartedAt과 retentionCutoffReceivedAt에 5분을 더한 시각 중 최댓값입니다."
        availableThrough:
          $ref: "#/components/schemas/UtcInstant"
          description: "조회 전체에 일관되게 적용하는 asOf입니다."
        reasons:
          type: "array"
          description: "수집 이전·보존 만료·진행 중 기간의 적용 사유입니다."
          uniqueItems: true
          items:
            type: "string"
            enum:
              - "BEFORE_COLLECTION"
              - "RETENTION_EXPIRED"
              - "OPEN_PERIOD"
        countsMeaning:
          type: "string"
          description: "기록되었고 현재 접근 가능한 이벤트만 셉니다. 실제 미수집 활동이 0임을 주장하지 않습니다."
          const: "RECORDED_ELIGIBLE_EVENTS_ONLY"
    BehaviorProfileVisitDaily:
      type: "object"
      additionalProperties: false
      description: "날짜별 수집 범위를 독립적으로 계산한 들어온 프로필 방문 지표입니다."
      required:
        - "date"
        - "coverageStatus"
        - "visitCount"
        - "distinctVisitorCount"
      properties:
        date:
          $ref: "#/components/schemas/UtcDate"
          description: "서울 기준 날짜이며 요청한 모든 날짜를 오름차순으로 반환합니다."
        coverageStatus:
          type: "string"
          description: "해당 기간의 수집 및 논리 보존 범위입니다."
          enum:
            - "COMPLETE"
            - "PARTIAL"
            - "NONE"
        visitCount:
          type:
            - "integer"
            - "null"
          description: "해당 날짜의 방문 수이며 NONE이면 null입니다."
          format: "int64"
          minimum: 0
        distinctVisitorCount:
          type:
            - "integer"
            - "null"
          description: "해당 날짜의 서로 다른 방문 학생 수이며 NONE이면 null입니다."
          format: "int64"
          minimum: 0
      allOf:
        - if:
            properties:
              coverageStatus:
                const: "NONE"
          then:
            properties:
              visitCount:
                type: "null"
              distinctVisitorCount:
                type: "null"
          else:
            properties:
              visitCount:
                type: "integer"
              distinctVisitorCount:
                type: "integer"
    BehaviorAuthorInterestDaily:
      type: "object"
      additionalProperties: false
      description: "방향성 작성자 관심만 나타내며 카테고리 관심이나 클릭을 방문으로 대체하지 않습니다."
      required:
        - "date"
        - "coverageStatus"
        - "profileVisitCount"
      properties:
        date:
          $ref: "#/components/schemas/UtcDate"
          description: "서울 기준 날짜이며 요청한 모든 날짜를 오름차순으로 반환합니다."
        coverageStatus:
          type: "string"
          description: "해당 기간의 수집 및 논리 보존 범위입니다."
          enum:
            - "COMPLETE"
            - "PARTIAL"
            - "NONE"
        profileVisitCount:
          type:
            - "integer"
            - "null"
          description: "본인에서 특정 작성자로 향한 날짜별 방문 수이며 NONE이면 null입니다."
          format: "int64"
          minimum: 0
      allOf:
        - if:
            properties:
              coverageStatus:
                const: "NONE"
          then:
            properties:
              profileVisitCount:
                type: "null"
          else:
            properties:
              profileVisitCount:
                type: "integer"
    BehaviorProfileVisitMetrics:
      type: "object"
      additionalProperties: false
      description: "개별 방문자 목록 없이 집계만 제공합니다. 이벤트마다 현재 구성원 상태와 양방향 차단을 재검증합니다."
      required:
        - "schemaVersion"
        - "academyId"
        - "period"
        - "asOf"
        - "coverage"
        - "studentId"
        - "visitCount"
        - "distinctVisitorCount"
        - "daily"
      properties:
        schemaVersion:
          type: "integer"
          description: "내부 지표 계약 버전입니다."
          const: 1
        academyId:
          $ref: "#/components/schemas/Uuid"
          description: "조회 대상 학원 UUID입니다."
        period:
          $ref: "#/components/schemas/BehaviorMetricPeriod"
          description: "조회한 서울 날짜 반개구간입니다."
        asOf:
          $ref: "#/components/schemas/UtcInstant"
          description: "발생 시각 상한과 보존 판정에 쓰는 한 번의 일관된 조회 시각입니다."
        coverage:
          $ref: "#/components/schemas/BehaviorMetricCoverage"
          description: "수집 가능성과 논리 보존 상태를 수치와 함께 해석합니다."
        studentId:
          $ref: "#/components/schemas/Uuid"
          description: "들어온 방문을 집계할 현재 학원 학생 UUID입니다."
        visitCount:
          type:
            - "integer"
            - "null"
          description: "현재 접근이 유효한 방문 이벤트 수입니다. NONE이면 null입니다."
          format: "int64"
          minimum: 0
        distinctVisitorCount:
          type:
            - "integer"
            - "null"
          description: "전체 기간의 서로 다른 방문자 수로 일별 고유 방문자 수를 더한 값이 아닙니다. NONE이면 null입니다."
          format: "int64"
          minimum: 0
        daily:
          type: "array"
          description: "요청한 모든 날짜의 오름차순 지표입니다."
          items:
            $ref: "#/components/schemas/BehaviorProfileVisitDaily"
          minItems: 1
          maxItems: 90
      allOf:
        - if:
            properties:
              coverage:
                properties:
                  status:
                    const: "NONE"
          then:
            properties:
              visitCount:
                type: "null"
              distinctVisitorCount:
                type: "null"
          else:
            properties:
              visitCount:
                type: "integer"
              distinctVisitorCount:
                type: "integer"
    BehaviorAuthorInterestMetrics:
      type: "object"
      additionalProperties: false
      description: "양쪽 현재 학원 소속과 양방향 차단 부재가 필요하며 작성자 관심만 제공합니다."
