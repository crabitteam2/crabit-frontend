    post:
      tags: [Wishes]
      operationId: withdrawFromWish
      summary: "위시에서 자금 인출"
      description: "일치하는 멱등 재생은 최초 Wish snapshot의 identity·상태·version·event identity를 유지합니다. NO_PHOTO는 이후 현재 attachment가 있어도 null이고, ACTIVE_PHOTO는 캡처된 정확한 photoId가 같은 소유자와 위시에 유효하게 ATTACHED인 경우에만 새 5분 URL로 성공합니다. PHOTO_REVOKED이면 성공 본문 없이 409 WISH_PHOTO_EXPIRED이고, 유효한 사진의 URL 발급만 실패하면 503 PHOTO_DELIVERY_UNAVAILABLE입니다."
      security: [{SyntheticBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WishAmountCommand'}
      responses:
        '200': {$ref: '#/components/responses/WishMutationSuccess'}
        '400': {$ref: '#/components/responses/MalformedOrIdempotencyRequired'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WishOrAccountNotFound'}
        '409': {$ref: '#/components/responses/WithdrawalConflict'}
        '422': {$ref: '#/components/responses/InvalidAmountOrVersion'}
        '503': {$ref: '#/components/responses/PhotoDeliveryUnavailable'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/transfers:
    parameters: [{$ref: '#/components/parameters/CardBalanceAccountId'}]
    post:
      tags: [Wishes]
      operationId: transferWishFunds
      summary: "동일 계정의 두 위시 간 자금 원자적 이체"
      description: "출발·도착 Wish snapshot과 각각의 private photo replay state를 이체 성공 결과와 함께 원자적으로 캡처합니다. 일치 재생은 두 상태를 URL 발급 전에 함께 평가합니다. 각 NO_PHOTO는 이후 현재 attachment와 무관하게 null을 유지하고, 각 ACTIVE_PHOTO는 캡처된 정확한 photoId가 같은 소유자와 정확한 위시에 유효하게 ATTACHED인 경우에만 새 5분 URL을 받습니다. 어느 한쪽이라도 PHOTO_REVOKED이면 다른 쪽 URL을 발급하거나 부분 본문을 반환하지 않고 전체 재생이 409 WISH_PHOTO_EXPIRED로 실패합니다. 모든 필요한 URL 중 하나라도 발급하지 못하면 receipt를 바꾸지 않고 전체 재생이 503 PHOTO_DELIVERY_UNAVAILABLE로 실패합니다. 성공 재생에만 Idempotency-Replayed true를 보냅니다."
      security: [{SyntheticBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WishTransferRequest'}
      responses:
        '200':
          description: "원자적 이체가 완료되었습니다. 동일 요청 재생은 출발·도착의 최초 domain 결과와 각 ACTIVE_PHOTO의 정확한 photoId 또는 NO_PHOTO의 null을 유지하고, 양쪽을 모두 검증한 뒤 ephemeral photo URL만 새로 발급합니다."
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WishTransferResult'}
        '400': {$ref: '#/components/responses/MalformedOrIdempotencyRequired'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WishOrAccountNotFound'}
        '409': {$ref: '#/components/responses/TransferConflict'}
        '422': {$ref: '#/components/responses/InvalidTransferAmountOrVersion'}
        '503': {$ref: '#/components/responses/PhotoDeliveryUnavailable'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/wishes/{wishId}/completion:
