  /v1/wish-photos:
    post:
      tags: [Wishes]
      operationId: uploadWishPhoto
      summary: "위시에 첨부할 비공개 사진 업로드"
      description: "인증된 학생 소유의 Pending 사진을 동기적으로 만듭니다. 정확히 하나의 photo 파트만 허용하고 5 MiB보다 큰 바이트 스트림은 디코딩 전에 중단합니다. 실제 JPEG 1080x1080 이미지만 디코딩한 뒤 EXIF·위치 메타데이터를 제거하고 1080x1080, 720x720, 360x360 JPEG로 재인코딩합니다. adult, racy, violence가 LIKELY 또는 VERY_LIKELY이면 PHOTO_CONTENT_NOT_ALLOWED로 거부하지만 medical 또는 spoof가 POSSIBLE인 것만으로는 거부하지 않습니다. 요청 지문은 multipart framing·boundary·filename을 제외한, 변환 전 수신 photo 파트 정확한 바이트의 SHA-256입니다. 소유자와 Idempotency-Key로 범위가 정해진 최소 receipt는 최초 receipt 생성 업로드가 시작된 시점부터 정확히 24시간 동안만 효력이 있습니다. 보존 중인 같은 지문의 ACTIVE_SUCCESS는 변환·검사·저장·quota 소비를 반복하지 않고 같은 photoId와 새 5분 signed URL을 201로 재생합니다. 새 URL 발급만 실패하면 receipt를 바꾸지 않고 503 PHOTO_DELIVERY_UNAVAILABLE을 반환합니다. 같은 지문의 REVOKED_SUCCESS 또는 이미 재생할 수 없는 사진은 사진·URL·receipt 세부 정보 없이 409 WISH_PHOTO_EXPIRED를 반환하고, 다른 지문은 처리 전에 409 IDEMPOTENCY_KEY_REUSED를 반환합니다. 보존한 결정적 거부는 원래 status와 안정적 code를 재생하되 자유 형식 message는 보존하지 않습니다. request time이 retainUntil에 도달하면 이전 receipt는 논리적으로 없으며 같은 key를 새 업로드에 재사용할 수 있습니다. 첨부 자체와 완료·포기는 성공 receipt를 폐기하지 않지만 Pending 취소·만료, 교체·명시적 제거, Wish 삭제, DELETE_PENDING 전환, hard cleanup은 파괴적 정리 전에 REVOKED_SUCCESS로 바꾸고 retainUntil까지 receipt를 남깁니다. 학생별 미첨부 Pending 사진은 최대 3개이고 rolling 1시간의 새 처리 시도는 최대 20회입니다. 파일 이름은 신뢰하지 않고 업로더 identity는 인증 주체에서만 결정합니다."
      security: [{SyntheticBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/WishPhotoUploadRequest'}
            encoding:
              photo:
                contentType: image/jpeg
      responses:
        '201':
          description: "검증·안전성 검사·비공개 변형 저장이 완료된 미첨부 Pending 사진입니다. 멱등 재생은 같은 사진 identity에 새 5분 signed URL을 발급합니다."
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WishPhoto'}
              examples:
                uploaded: {$ref: '#/components/examples/WishPhotoUploaded'}
                active-same-content-replay: {$ref: '#/components/examples/WishPhotoActiveReplay'}
        '400': {$ref: '#/components/responses/MalformedOrIdempotencyRequired'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/WishPhotoUploadConflict'}
        '413': {$ref: '#/components/responses/PhotoTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedPhotoType'}
        '422': {$ref: '#/components/responses/InvalidOrRejectedPhoto'}
        '429': {$ref: '#/components/responses/PhotoUploadRateLimited'}
        '503': {$ref: '#/components/responses/PhotoUploadUnavailable'}
      x-processing-policy:
        canonicalVariant: 1080x1080 JPEG
        derivedVariants: [720x720 JPEG, 360x360 JPEG]
        metadata: "모든 저장 변형에서 EXIF와 위치 메타데이터를 제거합니다."
        rejectContentSafety:
          categories: [adult, racy, violence]
          likelihoods: [LIKELY, VERY_LIKELY]
        notRejectedByThemselves:
          categories: [medical, spoof]
          likelihoods: [POSSIBLE]
        retainedProductSafetyData: none
      x-quotas:
        maximumUnattachedPendingPhotosPerStudent: 3
        maximumNewProcessingAttemptsPerStudentPerRollingHour: 20
      x-idempotency-receipt:
        scope: [authenticatedOwner, Idempotency-Key]
        contentDigest: "변환 전 수신 photo 파트 정확한 바이트의 SHA-256입니다. multipart framing, boundary, filename은 제외합니다."
        retention:
          duration: PT24H
          startsAt: initial-receipt-creating-upload-began
          retainedWhile: requestTime < retainUntil
          expiresAtOrAfter: requestTime >= retainUntil
          expiredRowDeletion: "retainUntil에 도달한 첫 owner-key lookup 또는 cleanup이 row를 삭제하며 물리적 지연은 API 보존 기간을 늘리지 않습니다."
        retainedFields: [owner, idempotencyKey, contentDigest, outcome, photoId]
        outcomeKinds: [ACTIVE_SUCCESS, REVOKED_SUCCESS, PHOTO_TOO_LARGE, UNSUPPORTED_PHOTO_TYPE, INVALID_PHOTO, PHOTO_CONTENT_NOT_ALLOWED]
        photoId: "ACTIVE_SUCCESS와 REVOKED_SUCCESS에서만 non-null입니다."
        forbiddenRetainedData: [rawImageBytes, transformedImageBytes, filename, multipartBody, signedUrls, bucket, objectPath, errorMessage, contentSafetyCategory, contentSafetyLikelihood, providerPayload, imageMetadata, traceId]
        notRetainedOutcomes: [PHOTO_UPLOAD_RATE_LIMITED, PHOTO_PROCESSING_UNAVAILABLE, PHOTO_DELIVERY_UNAVAILABLE, authenticationFailure, malformedRequestWithoutUsableKeyAndDigest, unexpectedServerFailure]
        lookupAndResponseOrder:
          - "quota 계산·변환·안전성 검사·저장·객체 쓰기 전에 인증 소유자와 key의 미만료 receipt를 lock합니다."
          - "receipt가 없으면 새 업로드와 terminal receipt 생성을 원자적으로 처리합니다."
          - "다른 digest의 receipt는 새 처리 전에 IDEMPOTENCY_KEY_REUSED입니다."
          - "같은 digest의 유효한 ACTIVE_SUCCESS는 같은 photoId와 새 5분 URL을 201로 반환합니다. URL 발급 실패는 receipt를 바꾸지 않고 PHOTO_DELIVERY_UNAVAILABLE입니다."
          - "같은 digest의 REVOKED_SUCCESS 또는 재생 불가능한 ACTIVE_SUCCESS는 URL과 receipt 세부 정보 없이 WISH_PHOTO_EXPIRED입니다."
          - "결정적 거부 outcome은 원래 status와 code의 현재 canonical message를 재생하고 처리를 반복하지 않습니다."
        validSuccessStates: [unexpired-unattached-PENDING, ATTACHED-including-after-COMPLETED-or-ABANDONED]
        revocationTriggers: [pendingCancellation, pendingAttachmentExpiry, photoReplacement, explicitPhotoRemoval, wishDeletion, DELETE_PENDING, hardObjectOrPhotoRowCleanup]
        transitionOrder:
          - "파괴적 정리 전에 REVOKED_SUCCESS로 전환하고 receipt는 retainUntil까지 보존합니다."
          - "ACTIVE_SUCCESS가 참조하는 사진 또는 객체가 없으면 REVOKED_SUCCESS로 복구하고 WISH_PHOTO_EXPIRED로 fail closed 합니다."
          - "첨부, Wish 완료, Wish 포기는 유효한 사진을 revoke하지 않습니다."
          - "receipt 만료·삭제는 유효한 첨부 사진을 삭제하거나 revoke하지 않습니다."
        concurrency:
          serializationBoundary: [authenticatedOwner, Idempotency-Key]
          sameKeyMaximumNewTerminalReceiptAndPhoto: 1
          expiryAndReuseUseSameLock: true
          revocationCommitsBeforeDestructiveCleanup: true
          failedNewUploadLeavesNoAttachablePhotoOrActiveSuccessReceipt: true
  /v1/wish-photos/{photoId}:
    parameters: [{$ref: '#/components/parameters/WishPhotoId'}]
    delete:
      tags: [Wishes]
      operationId: deletePendingWishPhoto
      summary: "미첨부 Pending 위시 사진 취소"
      description: "인증된 소유자만 미첨부 Pending 사진을 취소할 수 있습니다. 소유한 PENDING 또는 만료 사진은 즉시 첨부 불가능한 DELETE_PENDING으로 바꾸고 204를 반환하며 객체 제거와 hard delete는 비동기로 이어집니다. 성공한 취소는 정리를 enqueue하기 전에 보존 중인 성공 업로드 receipt를 REVOKED_SUCCESS로 바꾸고 retainUntil까지 남깁니다. 같은 소유자가 DELETE_PENDING 상태에서 반복하면 204 no-op입니다. 없거나 다른 학생 소유인 식별자는 404 WISH_PHOTO_NOT_FOUND로 숨기고, 위시에 이미 첨부된 사진은 409 WISH_PHOTO_ALREADY_ATTACHED를 반환합니다. photoId나 기존 signed URL 자체는 권한을 부여하지 않습니다."
      security: [{SyntheticBearer: []}]
      responses:
        '204':
          description: "사진이 즉시 첨부 불가능해졌거나 이미 같은 소유자의 DELETE_PENDING 상태입니다. 응답 본문은 없습니다."
        '400': {$ref: '#/components/responses/MalformedRequest'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WishPhotoNotFound'}
        '409': {$ref: '#/components/responses/WishPhotoAlreadyAttached'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/wishes:
    parameters: [{$ref: '#/components/parameters/CardBalanceAccountId'}]
    get:
      tags: [Wishes]
      operationId: listWishes
      summary: "계정이 소유한 삭제되지 않은 위시 목록 조회"
      description: "불투명 커서를 사용하며 createdAt DESC, id DESC 순으로 정렬합니다. 각 위시는 카드 잔액 계정의 조회 시점 OPEN 잔액 조정 상태를 반환합니다. 첨부 사진이 하나라도 있으면 모든 항목의 새 5분 비공개 URL을 발급한 뒤에만 전체 페이지를 반환하며, signing 실패는 부분 페이지나 거짓 null 없이 503입니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items: {$ref: '#/components/schemas/WishState'}
      responses:
        '200':
          description: "삭제되지 않은 위시 페이지입니다."
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WishPage'}
              examples:
                empty-page: {$ref: '#/components/examples/EmptyWishPage'}
        '400': {$ref: '#/components/responses/MalformedRequest'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CardBalanceAccountNotFound'}
        '503': {$ref: '#/components/responses/PhotoDeliveryUnavailable'}
    post:
      tags: [Wishes]
      operationId: createWish
      summary: "초기 적립금이 0인 비공개 위시 생성"
      description: "잔액 정보가 UNKNOWN이거나 OPEN 잔액 불일치가 없을 때 amount 0, state IN_PROGRESS, visibility PRIVATE인 위시를 생성합니다. photoId가 생략되거나 null이면 사진 없이 만들고, UUID이면 인증된 학생 소유의 만료되지 않은 미첨부 Pending 사진을 새 위시에 원자적으로 첨부합니다. 성공한 첨부는 사진 업로드 receipt의 ACTIVE_SUCCESS를 유지하며 24시간 retainUntil을 소비·연장·교체하지 않습니다. 첨부 실패 시 위시와 attachment 모두 생성하지 않습니다. 일치하는 Idempotency-Key의 이전 성공 결과는 현재 불일치 방어 조건보다 먼저 재생합니다. 최초 성공에 사진이 있으면 private ACTIVE_PHOTO 상태가 그 정확한 photoId를 유효한 동안만 보존하고 재생 때 소유권과 같은 위시 attachment를 재검증하여 새 5분 URL을 발급합니다. 최초 성공에 사진이 없던 NO_PHOTO는 이후 현재 사진이 붙어도 대체하지 않고 photo null을 반환합니다. 원래 사진이 교체·제거·revocation·Wish 삭제·cleanup으로 무효화되면 식별자 없는 PHOTO_REVOKED가 되어 Wish 성공 본문 없이 409 WISH_PHOTO_EXPIRED를 반환합니다. 새 URL 발급만 실패하면 receipt를 바꾸지 않고 부분 성공 본문 없이 503 PHOTO_DELIVERY_UNAVAILABLE을 반환합니다. 성공 재생에만 Idempotency-Replayed true를 보냅니다. 응답 capability 발급은 commit 전에 완료하므로 signing 실패가 비멱등 commit을 모호하게 만들지 않습니다. 그 밖의 경우 OPEN 잔액 조정 건이 있으면 새 위시를 저장하기 전에 409 BALANCE_MISMATCH_LOCKED로 생성을 거부합니다."
      security: [{SyntheticBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWishRequest'}
            examples:
              purpose-ascii-boundaries: {$ref: '#/components/examples/PurposeAsciiBoundaries'}
              purpose-decomposed-nfc: {$ref: '#/components/examples/PurposeDecomposedNfc'}
              purpose-nbsp-boundaries: {$ref: '#/components/examples/PurposeNbspBoundaries'}
              create-with-photo: {$ref: '#/components/examples/CreateWishWithPhoto'}
      responses:
        '201':
          description: "위시가 생성되었습니다. 동일 요청 재생은 최초 domain 결과와 ACTIVE_PHOTO의 정확한 photoId 또는 NO_PHOTO의 null을 유지하고, 유효한 ACTIVE_PHOTO의 ephemeral URL만 새로 발급합니다."
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WishMutationResult'}
              examples:
                wish-created-private-zero: {$ref: '#/components/examples/WishCreatedPrivateZero'}
                active-photo-replay: {$ref: '#/components/examples/WishMutationActivePhotoReplay'}
                no-photo-replay-after-later-attachment: {$ref: '#/components/examples/WishMutationNoPhotoReplayAfterLaterAttachment'}
        '400': {$ref: '#/components/responses/MalformedOrIdempotencyRequired'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CreateWishResourceNotFound'}
        '409': {$ref: '#/components/responses/CreateConflict'}
        '415':
          description: "UNSUPPORTED_MEDIA_TYPE — Content-Type이 application/json이 아닙니다."
          x-error-codes: [UNSUPPORTED_MEDIA_TYPE]
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422': {$ref: '#/components/responses/InvalidAmountOrPurpose'}
        '503': {$ref: '#/components/responses/PhotoDeliveryUnavailable'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/wishes/{wishId}:
    parameters:
      - $ref: '#/components/parameters/CardBalanceAccountId'
      - $ref: '#/components/parameters/WishId'
    get:
      tags: [Wishes]
      operationId: getWish
      summary: "소유한 삭제되지 않은 위시 조회"
      description: "위시가 속한 카드 잔액 계정의 조회 시점 OPEN 잔액 조정 상태를 반환합니다. OPEN 잔액 조정 건이 있어도 이 조회를 차단하지 않습니다. 사진이 있으면 현재 소유권을 다시 확인하고 새 5분 비공개 URL을 모두 발급한 뒤 반환하며 signing 실패는 거짓 null 없이 503입니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "위시입니다."
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Wish'}
        '400': {$ref: '#/components/responses/MalformedRequest'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WishOrAccountNotFound'}
        '503': {$ref: '#/components/responses/PhotoDeliveryUnavailable'}
    patch:
      tags: [Wishes]
      operationId: patchWish
      summary: "변경 가능한 위시 필드를 원자적으로 병합 패치"
      description: "필드를 생략하면 기존 값을 유지하고 targetDate에 null을 지정하면 날짜를 지웁니다. photoId를 생략하면 현재 사진을 유지하고 null이면 제거하며, 현재 사진과 같은 UUID이면 성공 no-op, 다른 UUID이면 새 Pending 사진을 원자적으로 첨부하고 이전 사진을 즉시 접근 불가능한 DELETE_PENDING으로 만듭니다. 교체나 명시적 제거는 이전 사진의 보존 중인 성공 업로드 receipt를 파괴적 정리 전에 REVOKED_SUCCESS로 바꾸고, 새로 첨부한 사진의 ACTIVE_SUCCESS와 retainUntil은 유지합니다. 사진 추가·교체·제거는 IN_PROGRESS 또는 AMOUNT_REACHED에서만 허용하고, terminal 위시에 photoId를 제공하면 보존된 사진과 같은 값이어도 INVALID_STATE_TRANSITION입니다. expectedVersion은 계속 필수이며 stale 음수 아닌 값은 VERSION_CONFLICT입니다. 교체 실패는 기존 attachment와 후보 Pending 사진을 그대로 유지합니다. 성공한 사진 변경은 version과 updatedAt, 존재하는 Shared Card의 contentUpdatedAt을 갱신합니다. 잔액 불일치가 없을 때 COMPLETED 또는 ABANDONED 위시는 공개 범위만 변경할 수 있습니다. 위시를 포기하면 공유 카드를 제거하지만 첨부 사진과 ACTIVE_SUCCESS receipt는 보존합니다. 포기된 위시의 공개 범위를 변경하면 소유자에게 보이는 위시 메타데이터만 갱신하고 공유 카드는 절대 생성하지 않습니다. OPEN 잔액 조정 건이 있으면 purpose, targetAmount, targetDate를 비롯해 공개 범위를 확대·축소하거나 PRIVATE로 바꾸는 모든 요청 필드를 거부합니다. 응답 capability 발급은 commit 전에 끝나야 합니다."
      security: [{SyntheticBearer: []}]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/WishMergePatch'}
            examples:
              replace-photo: {$ref: '#/components/examples/PatchWishReplacePhoto'}
              remove-photo: {$ref: '#/components/examples/PatchWishRemovePhoto'}
      responses:
        '200':
          description: "원자적으로 갱신된 위시입니다."
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WishMutationResult'}
        '400': {$ref: '#/components/responses/MalformedRequest'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WishAccountOrPhotoNotFound'}
        '409': {$ref: '#/components/responses/PatchConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/InvalidAmountPurposeOrVersion'}
        '503': {$ref: '#/components/responses/PhotoDeliveryUnavailable'}
    delete:
      tags: [Wishes]
      operationId: deleteWish
      summary: "위시 논리 삭제"
      description: "최종 변경 결과를 반환합니다. 첨부 사진은 같은 domain transaction에서 즉시 접근 불가능한 DELETE_PENDING으로 바꾸고, 보존 중인 성공 업로드 receipt를 파괴적 정리 전에 REVOKED_SUCCESS로 변경하여 retainUntil까지 남깁니다. 동시에 소유자의 모든 Wish mutation receipt에서 그 photoId인 ACTIVE_PHOTO를 식별자 없는 PHOTO_REVOKED로 원자적으로 바꾼 뒤 삭제 성공 snapshot을 캡처합니다. 따라서 deleteWish 자체의 성공 receipt는 항상 NO_PHOTO를 저장하고 일치 재생은 이후 사진 상태를 조회하지 않은 채 원래 photo null 결과를 반환하므로 DeleteConflict에는 WISH_PHOTO_EXPIRED가 없습니다. redaction이 실패하면 삭제와 사진 revocation도 rollback합니다. tombstone과 불변 이력에는 사진 identity나 URL을 남기지 않습니다. 응답 capability 발급은 commit 전에 완료합니다. 이후의 모든 조회는 WISH_NOT_FOUND로 숨깁니다. OPEN 잔액 조정 건이 있어도 삭제를 차단하지 않습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {$ref: '#/components/responses/WishMutationSuccess'}
        '400': {$ref: '#/components/responses/DeletePreconditionRequired'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WishOrAccountNotFound'}
        '409': {$ref: '#/components/responses/DeleteConflict'}
        '422': {$ref: '#/components/responses/InvalidIfMatchVersion'}
        '503': {$ref: '#/components/responses/PhotoDeliveryUnavailable'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/wishes/{wishId}/deposits:
    parameters:
      - $ref: '#/components/parameters/CardBalanceAccountId'
      - $ref: '#/components/parameters/WishId'
    post:
      tags: [Wishes]
      operationId: depositToWish
      summary: "카드 잔액 계정 자금을 위시에 적립"
      description: "내부에서 PRE_DEPOSIT 조회를 수행합니다. 외부 제공자 조회가 실패하면 위시는 변경되지 않습니다. 저장된 불일치 관측 결과는 이 입금 작업만 잠그고 거부합니다. 일치하는 멱등 재생은 최초 Wish snapshot의 NO_PHOTO를 그대로 null로 유지하거나, 유효한 ACTIVE_PHOTO의 정확한 photoId에만 새 5분 URL을 발급합니다. 원래 사진이 PHOTO_REVOKED이면 성공 본문 없이 409 WISH_PHOTO_EXPIRED이고, URL 발급만 실패하면 503 PHOTO_DELIVERY_UNAVAILABLE입니다."
      security: [{SyntheticBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WishAmountCommand'}
      responses:
        '200': {$ref: '#/components/responses/WishMutationSuccess'}
        '400': {$ref: '#/components/responses/MalformedOrIdempotencyRequired'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WishOrAccountNotFound'}
        '409': {$ref: '#/components/responses/DepositConflict'}
        '422': {$ref: '#/components/responses/InvalidAmountOrVersion'}
        '503': {$ref: '#/components/responses/BalanceSyncOrPhotoDeliveryUnavailable'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/wishes/{wishId}/withdrawals:
