        eventType: {type: string, const: WISH_DELETION_RETURN, description: "항상 WISH_DELETION_RETURN, 논리 삭제 중에 제거된 0이 아닌 자금을 식별합니다."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "논리 삭제 과정에서 위시 자금을 반환한 RFC 3339 UTC Z 시점입니다."}
        wishPurposeSnapshot: {$ref: '#/components/schemas/Purpose', description: "원장 효과에 의해 이 위시에 대해 포착된 불변의 삭제 시점 목적입니다."}
        wishAmountDelta:
          description: "이 위시에서 반환된 음수 정수 KRW입니다. 반환액이 0이면 이벤트나 이력 항목을 만들지 않습니다."
          allOf: [{$ref: '#/components/schemas/KrwSigned'}, {maximum: -1}]
        wishAmountAfter: {type: integer, const: 0, description: "논리 삭제 후에는 항상 0 KRW입니다."}
        correctionOfEventId: {type: [string, 'null'], format: uuid, description: "이 새 이벤트가 보상하는 이전의 불변 동일 계정 이벤트이며, 보상 대상이 없으면 null입니다."}
        balanceAdjustment:
          description: "잔액 조정 건과 연결된 불변 이벤트 출처 정보이며, 연결된 잔액 조정 건이 없으면 null입니다."
          oneOf: [{$ref: '#/components/schemas/BalanceAdjustmentEventReference'}, {type: 'null'}]
    WishFundMovementPage:
      type: object
      additionalProperties: false
      required: [wish, items, nextCursor]
      properties:
        wish: {$ref: '#/components/schemas/WishHistorySubject', description: "불변 효과를 반환하는 소유자의 활성 위시 또는 논리 삭제 위시에 대한 조회 시점 대상 맥락입니다."}
        items:
          description: "이 위시에 대한 불변 원장 효과만 occurredAt DESC, eventId DESC 순으로 반환합니다. CARD_BALANCE_CHANGE는 절대 포함하지 않습니다."
          type: array
          items: {$ref: '#/components/schemas/WishFundMovement'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "다른 항목이 존재할 때 최종 반환된 (occurredAt, eventId) 튜플에서 파생된 불투명 커서입니다. 빈 페이지와 종결 상태 페이지의 경우 null입니다."}
    SharedCard:
      oneOf:
        - $ref: '#/components/schemas/ProgressSharedCard'
        - $ref: '#/components/schemas/CompletionSharedCard'
        - $ref: '#/components/schemas/AbandonmentSharedCard'
      discriminator:
        propertyName: kind
        mapping:
          PROGRESS: '#/components/schemas/ProgressSharedCard'
          COMPLETION: '#/components/schemas/CompletionSharedCard'
          ABANDONMENT: '#/components/schemas/AbandonmentSharedCard'
    ProgressSharedCard:
      type: object
      additionalProperties: false
      required: [sharedCardId, kind, ownerId, ownerNickname, purpose, targetAmount, progressPercent, photo, startDate, targetDate, balanceAdjustmentInProgress, contentUpdatedAt]
      properties:
        sharedCardId: {$ref: '#/components/schemas/Uuid', description: "개인정보를 노출하지 않는 이 공유 카드 프로젝션의 안정적인 UUID입니다. 기반 위시 또는 계정 식별자는 노출하지 않습니다."}
        kind: {type: string, const: PROGRESS, description: "현재 게시된 미완료 위시 카드를 식별하는 PROGRESS 판별자입니다."}
        ownerId: {$ref: '#/components/schemas/Uuid', description: "작성 학생의 안정적인 UUID입니다. 학생 조회의 studentId와 같으며 sharedCardId 및 비공개 wishId와 구별됩니다. 닉네임 변경이나 완료 카드 교체 후에도 유지됩니다."}
        ownerNickname: {type: string, minLength: 1, description: "소유자의 현재 표시 닉네임이며 식별 키가 아닙니다. 작성자 식별은 ownerId를 사용합니다. 실명, 별도 studentId 속성, 계정 데이터 또는 실제 카드 데이터는 노출하지 않습니다."}
        purpose: {$ref: '#/components/schemas/Purpose', description: "게시된 NFC 정규화 위시 목적입니다."}
        targetAmount: {$ref: '#/components/schemas/KrwPositive', description: "게시된 양의 정수 KRW 목표 금액입니다. 소유자의 정확한 현재 위시 금액은 노출하지 않습니다."}
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: "내림 정수 나눗셈으로 계산합니다. 목표 미도달 진행률은 최대 99이고 목표에 도달했을 때만 100을 반환합니다."
        photo:
          description: "현재 권한 검사 뒤 발급된 5분 비공개 사진 URL 세트이며 첨부 사진이 없으면 null입니다."
          oneOf: [{$ref: '#/components/schemas/WishPhoto'}, {type: 'null'}]
        startDate: {type: [string, 'null'], format: date, description: "저장된 위시 시작 달력 날짜 LocalDate를 YYYY-MM-DD 또는 null로 직접 투영합니다. 필드는 항상 존재하며 미지정은 null입니다. 생성 시각이나 오늘 날짜로 보충하거나 시간대를 변환하지 않습니다."}
        targetDate: {type: [string, 'null'], format: date, description: "저장된 위시 목표 달력 날짜 LocalDate를 YYYY-MM-DD 또는 null로 직접 투영합니다. 필드는 항상 존재하며 미지정은 null입니다. 생성 시각이나 오늘 날짜로 보충하거나 시간대를 변환하지 않습니다."}
        balanceAdjustmentInProgress:
          type: boolean
          description: "응답 조회 시점에 소유자의 카드 잔액 계정에 OPEN 잔액 조정 건이 있을 때만 true입니다. 잔액 조정 건이 없거나 RESOLVED 이력만 있으면 false입니다. 이 값은 공유 카드에 저장되지 않으며 contentUpdatedAt이나 정렬 순서를 갱신하지 않습니다."
        contentUpdatedAt: {$ref: '#/components/schemas/UtcInstant', description: "임시 정렬에 사용하는 가장 최근 콘텐츠 또는 게시 상태 변경의 RFC 3339 UTC Z 시점입니다. 조회 시점의 관계 검사와 balanceAdjustmentInProgress는 이 값을 바꾸지 않습니다."}
    CompletionSharedCard:
      type: object
      additionalProperties: false
      required: [sharedCardId, kind, ownerId, ownerNickname, purpose, targetAmount, progressPercent, photo, startDate, targetDate, createdAt, completedAt, actualDurationSeconds, contentUpdatedAt]
      properties:
        sharedCardId: {$ref: '#/components/schemas/Uuid', description: "개인정보를 노출하지 않는 이 공유 카드 프로젝션의 안정적인 UUID입니다. 기반 위시 또는 계정 식별자는 노출하지 않습니다."}
