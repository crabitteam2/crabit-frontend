        eventType: {type: string, const: WISH_WITHDRAWAL, description: "항상 WISH_WITHDRAWAL, 이 위시에서 제거된 자금을 식별합니다."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "이 불변 출금 이벤트가 발생한 RFC 3339 UTC Z 시점입니다."}
        wishPurposeSnapshot: {$ref: '#/components/schemas/Purpose', description: "이벤트가 발생했을 때 원장 효과에 의해 이 위시에 대해 포착된 불변의 목적입니다."}
