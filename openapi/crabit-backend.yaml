openapi: 3.1.0
info:
  title: Crabit API
  version: 0.0.1
  description: "소유자용 카드 잔액 계정(Card Balance Account), 주간·월간 리캡(Recap), 위시(Wish) 작업과 학원용 공유 카드(Shared Card) 조회, 학생 관계(Student Relationships), 잔액 조정 건(Balance Adjustment Case) 상태 표시를 제공합니다. 리소스 소유권과 현재 공개 범위는 리소스별 404 응답으로 숨깁니다. 모든 타임스탬프는 RFC 3339 UTC Z 형식이며, 모든 KRW 금액은 범위가 제한된 정수 원 단위입니다. 모든 오류 본문은 공통 ErrorEnvelope를 사용합니다."
servers:
  - url: /
tags:
  - name: Card Balance Accounts
    description: "카드 잔액 계정(Card Balance Account)의 잔액, 새로고침, 원장 이력과 잔액 조정 건(Balance Adjustment Case) 상태를 다룹니다."
  - name: Recaps
    description: "인증된 학생이 소유한 카드 잔액 계정의 완료된 주간·월간 리캡(Recap) 상태와 저장된 결과를 조회합니다."
  - name: Wishes
    description: "위시(Wish)의 생성, 조회, 변경, 삭제, 대표 선택과 자금 이동을 다룹니다."
  - name: Shared Cards
    description: "학원에 공개되는 공유 카드(Shared Card) 조회를 다룹니다."
  - name: Student Relationships
    description: "같은 학원 학생 간 학생 관계(Student Relationships)의 검색, 방향성 팔로우·언팔로우, 팔로잉·팔로워 목록과 전역 차단을 다룹니다."
x-recap-retrieval-policy:
  authentication:
    scheme: "SyntheticBearer"
    principalSource: "인증 주체에서만 학생을 결정하며 경로, 쿼리 또는 저장된 결과의 학생 식별자를 신뢰하지 않습니다."
    accountHiding: "없거나 종료되었거나 비소유이거나 다른 학원 소속인 카드 잔액 계정은 모두 CARD_BALANCE_ACCOUNT_NOT_FOUND로 숨깁니다."
  periodSelection:
    timezone: "Asia/Seoul"
    weekly: "weekStart는 월요일인 완료된 한 주의 시작일이어야 하며 생략하면 가장 최근 완료 주를 선택합니다."
    monthly: "month는 YYYY-MM 형식의 완료된 달이어야 하며 생략하면 가장 최근 완료 월을 선택합니다."
    rejection: "잘못되거나 반복되거나 알 수 없는 쿼리 매개 변수와 완료되지 않은 기간은 MALFORMED_REQUEST입니다."
  publicStates:
    NOT_GENERATED: "해당 논리 기간의 생성 이력이 없으며 generationVersion, algorithmVersion, generatedAt, result가 null입니다."
    GENERATING: "사용 가능한 현재 성공 결과가 없는 PENDING 또는 RUNNING 생성입니다. result와 generatedAt은 null입니다."
    NOT_ELIGIBLE: "MONTHLY에서 유효 입금이 세 건 미만인 확정 상태입니다. 저장된 버전 메타데이터를 반환하되 result는 null입니다."
    FAILED: "사용 가능한 현재 성공 결과가 없고 최신 생성이 실패했습니다. 내부 오류 원인 없이 result와 generatedAt은 null입니다."
    SUCCEEDED: "불변 저장된 공개 view와 생성 버전 메타데이터를 반환합니다. 활동이 0인 WEEKLY도 SUCCEEDED입니다."
    priorSuccess: "재생성이 PENDING, RUNNING 또는 FAILED여도 이전 현재 성공 버전이 있으면 그 버전을 SUCCEEDED로 계속 공개합니다."
    internalOnly: "SUPERSEDED와 내부 오류·QA 메트릭은 공개 상태나 응답 필드가 아닙니다."
  persistence:
    - "논리 계정, kind, 반개구간 기간, algorithmVersion, generationId, inputDigest를 유일하게 결속합니다."
    - "같은 입력 재시도는 같은 행을 재사용하고 새 입력은 새 version을 추가하며 다른 입력의 같은 generationId는 HTTP 전에 거부합니다."
    - "새 SUCCEEDED 또는 확정 NOT_ELIGIBLE만 durable storage 이후 원자적으로 current가 됩니다. 실패한 재생성은 이전 current 성공을 지우거나 숨기지 않습니다."
    - "저장된 view는 불변이며 대표 위시나 목표 변경으로 과거 결과를 재계산하지 않습니다."
  storyAuthorization:
    storedFields: [wishId, typeTitle]
    publicFields: [wishId, typeTitle, ownerStudentId, sharedCardId]
    rule: "각 조회에서 현재 공유 카드 공개 범위, 논리 삭제, 양방향 차단, viewer에서 owner로의 팔로우, 학원 소속을 다시 검증하고 실패한 story만 생략합니다. 저장된 Python 결과는 변경하지 않습니다."
    forbiddenFields: [wishTitle, ownerNickname, privateContent, ledgerRows, peerIdentity]
  compatibility:
    recommendationV3: "추천 schema v3, acknowledgement, endpoint, credential, feature flag, metrics와 package는 byte 및 의미상 변경하지 않습니다."
    frontend: "승인 뒤 frontend OpenAPI와 생성 타입은 이 backend OpenAPI의 정확한 bytes에서만 파생합니다."
x-wish-mutation-photo-replay:
  appliesTo: [createWish, depositToWish, withdrawFromWish, transferWishFunds, completeWish, abandonWish, deleteWish]
  scope:
    receiptNamespace: permanent-per-authenticated-student
    ownerSource: authenticated-principal-only
    operationTargetAndRequestFingerprintPreserved: true
  receiptState:
    encoding: private-tagged-union
    wireSchemaAddition: false
    variants:
      NO_PHOTO:
        retainedFields: [kind]
        meaning: "최초 성공 스냅샷의 photo가 null이었습니다."
        replay: "나중에 현재 사진이 첨부되어도 조회하거나 대체하지 않고 최초 photo null 성공 결과를 반환합니다."
      ACTIVE_PHOTO:
        retainedFields: [kind, photoId]
        meaning: "최초 성공 스냅샷에 포함된 정확한 사진 identity가 아직 유효합니다."
        replay: "동일한 인증 학생 소유이고 캡처된 정확한 위시에 ATTACHED 상태인 같은 photoId를 재검증한 뒤 새 5분 small, medium, large URL을 모두 발급합니다."
      PHOTO_REVOKED:
        retainedFields: [kind]
        meaning: "최초 성공 스냅샷의 사진이 더 이상 유효하지 않으며 삭제된 identity는 제거되었습니다."
        replay: "Wish 성공 본문이나 사진 capability 없이 409 WISH_PHOTO_EXPIRED를 반환합니다."
    invariants:
      - "photoId는 ACTIVE_PHOTO에만 존재합니다."
      - "NO_PHOTO는 이후 현재 attachment와 무관하게 NO_PHOTO로 유지됩니다."
      - "ACTIVE_PHOTO는 PHOTO_REVOKED로만 전이할 수 있습니다."
      - "PHOTO_REVOKED는 photoId, URL, object path, digest, timestamp 또는 revocation reason을 포함하지 않는 종결 상태입니다."
    legacyCompatibility: "사진 기능 이전 receipt의 캡처된 snapshot이 photo null이고 tag가 없으면 NO_PHOTO로 해석하고 다시 기록하며 현재 attachment에서 ACTIVE_PHOTO를 추론하지 않습니다."
  capture:
    singleWish: "성공 응답의 photo가 null이면 NO_PHOTO, 존재하면 정확히 그 photoId를 가진 ACTIVE_PHOTO를 원래 status, 비사진 snapshot, event identity, occurrence time, recorded time과 함께 저장합니다."
    transfer: "sourcePhotoReplayState와 destinationPhotoReplayState를 출발·도착 snapshot에 각각 결속해 이체 결과와 원자적으로 저장합니다."
    delete: "첨부 사진을 먼저 redaction·revocation한 뒤 성공 응답을 캡처하므로 deleteWish 결과는 항상 NO_PHOTO입니다."
  replay:
    validActivePhoto: "원래 상태·version·event identity·occurrence time을 유지하고 같은 photoId와 새 5분 URL만 재구성하여 원래 201 또는 200 status로 반환합니다."
    noPhoto: "현재 attachment를 조회하거나 대체하지 않고 원래 photo null 성공 결과를 반환합니다."
    revokedPhoto: "409 WISH_PHOTO_EXPIRED, retryable false, 표준 비공개 ErrorEnvelope만 반환하고 Idempotency-Replayed를 생략합니다."
    deliveryFailure: "모든 상태가 NO_PHOTO 또는 유효한 ACTIVE_PHOTO이지만 필요한 새 URL 하나라도 발급하지 못하면 503 PHOTO_DELIVERY_UNAVAILABLE, retryable true를 반환하고 부분 성공 본문과 Idempotency-Replayed를 생략하며 receipt를 바꾸지 않습니다."
    transferAtomicity: "두 캡처 상태를 URL 발급 전에 함께 평가합니다. 한쪽이라도 PHOTO_REVOKED이면 전체 재생을 WISH_PHOTO_EXPIRED로 실패시키고 다른 쪽 URL이나 부분 본문을 반환하지 않습니다."
    successHeaders: "성공한 일치 재생에만 Idempotency-Replayed true와 Cache-Control no-store를 반환합니다."
  atomicRedaction:
    triggers: [photoReplacement, explicitPhotoRemoval, pendingPhotoCancellation, pendingPhotoExpiry, wishDeletion, DELETE_PENDING, hardCleanup, integrityRepair]
    rule: "사진이 접근 불가능해지기 전에 소유자의 모든 create, deposit, withdrawal, transfer, completion, abandonment, delete receipt에서 같은 photoId인 ACTIVE_PHOTO를 한 원자적 update로 식별자 없는 PHOTO_REVOKED로 바꿉니다. 실패하면 revocation 또는 destructive cleanup도 rollback합니다."
    cleanupGuard: "어떤 소유자 mutation receipt에도 대상 photoId의 ACTIVE_PHOTO가 남아 있으면 object나 photo row를 삭제하지 않습니다. cleanup은 같은 잠금 아래에서 누락된 참조를 먼저 PHOTO_REVOKED로 복구합니다."
  lockOrder:
    - owner-mutation-receipt-namespace
    - wish-photo-upload-receipts-by-owner-key-photo-id
    - wish-photo-rows-by-ascending-photo-uuid
    - cleanup-work-rows
  concurrency:
    invariant: "mutation receipt photo state, upload receipt, photo row를 함께 다루는 모든 경로는 receipt 또는 receipt namespace를 먼저 잠그며 photo를 잠근 뒤 receipt를 잠그지 않습니다."
    discoveryAndRevalidation: "cancel, detach, replacement, expiry, cleanup은 소유자와 key 발견에 non-locking read를 사용할 수 있지만 정해진 잠금을 얻은 뒤 owner, photoId, state, attachment, replay-state match, retainUntil을 다시 검증합니다."
    linearizedOutcomes:
      replayFirst: "재생이 owner receipt namespace lock을 먼저 얻고 ACTIVE_PHOTO가 유효하면 원래 identity와 새 5분 URL로 성공합니다. 뒤따르는 revocation은 사진 상태를 바꾸기 전에 모든 일치 참조를 PHOTO_REVOKED로 redaction합니다."
      revocationFirst: "취소, 교체, 제거, 만료, Wish 삭제 또는 cleanup이 먼저 잠그면 upload receipt와 모든 Wish mutation replay state를 먼저 revoke·redact하고 뒤따르는 재생은 WISH_PHOTO_EXPIRED입니다."
      failureBoundary: "어느 순서도 PostgreSQL deadlock, current-photo substitution, deleted photoId retention, partial transfer capability 또는 문서화되지 않은 응답을 만들 수 없습니다."
  privacy:
    forbiddenReceiptData: [signedUrl, urlExpiry, bucket, objectPath, imageBytes, filename, multipartData, photoDigest, safetyProviderDetail, currentAttachmentAtReplay]
    forbiddenErrorData: [photoId, signedUrl, objectPath, contentDigest, retainedSnapshot, receiptState, revocationReason, currentAttachment]
  frontendBoundary:
    excludedBackendErrorCode: BFF_REQUEST_TIMEOUT
    rule: "408 BFF_REQUEST_TIMEOUT은 frontend BFF envelope code이며 backend ErrorCode enum에 추가하지 않습니다."
x-behavior-collection-policy:
  primitive_rules:
    - "UUIDs use canonical Uuid format."
    - "occurredAt must be RFC3339 UTC ending in Z; truncate fractional precision to microseconds before comparison and persistence."
    - "Output timestamps use UTC Z with at most six fractional digits."
    - "Missing required values, forbidden nulls, unknown or duplicate JSON properties, and invalid types return 400 MALFORMED_REQUEST."
    - "Unknown query parameters and repeated scalar query parameters on new operations return 400 MALFORMED_REQUEST."
    - "Request media type is application/json; unsupported media type returns existing 415 UNSUPPORTED_MEDIA_TYPE."
    - "Successes and errors use Cache-Control no-store."
    - "Counts use nonnegative int64, nullable only where coverage explicitly permits it."
  replay_and_time:
    - "One PostgreSQL unique key on actor/eventId spans all event types. Never perform a global eventId ownership lookup."
    - "Different actors may independently use the same eventId without sharing results or revealing records."
    - "Compare normalized type, academy, target, occurredAt, context, card, position, impressionId, and clickKind as applicable."
    - "Changed immutable fields yield EVENT_ID_CONFLICT; never return original payloads in errors."
    - "Authenticate and check current access to both submitted scope and retained original before replay or conflict disclosure."
    - "Authorized exact replay precedes new-event delay and context-age checks."
    - "Retain event and replay identity for 90 days from original receivedAt; the equality boundary is expired."
    - "New occurredAt is accepted inclusively from receivedAt minus 24 hours through receivedAt plus five minutes."
    - "Never clamp, replace, or shift invalid occurrence time."
    - "After replay retention, submission has no historical ID guarantee and is subject to new-event rules."
    - "Concurrent identical requests produce one new acceptance and one replay; conflicting requests produce one accepted winner and one conflict."
    - "Enforce event/impression uniqueness and conflict handling transactionally, not with check-then-insert alone."
  browser_collection:
    - "Exposure requires at least 50 percent visibility continuously for 1000 milliseconds while the document is visible."
    - "Falling below the threshold or hiding the document resets dwell and ends the visibility cycle."
    - "Each qualifying cycle gets a new impressionId and emits at most one exposure."
    - "A click before qualification uses that cycle's impressionId and remains valid without exposure."
    - "AUTHOR_PROFILE records the existing 방문하기 action. Destination profile entry independently emits PROFILE_VISIT."
    - "Retry the identical complete payload and identifiers; never generate replacements to evade conflicts."
    - "Frontend uses a maximum 100-event in-memory queue and at most three transient-failure retries within 24 hours."
    - "Stop on nonretryable 4xx; tracking never blocks navigation."
    - "Actual browser visibility/dwell and navigation validation remain frontend issues 95 and 96."
  internal_metrics:
    authentication:
      scheme: "MachineBehaviorBearer"
      enabled_property: "crabit.recommendation.handoff.enabled"
      credential_property: "crabit.recommendation.handoff.trigger-credential"
      rules:
        - "Register metrics controllers only when machine integration is enabled."
        - "Extend the existing shared matcher for exactly the three GET templates below, preserving existing POST recommendation-handoffs behavior."
        - "Require exactly one Authorization header with the configured trigger Bearer credential using existing constant-time comparison."
        - "Missing, wrong, duplicate, student, and receiver credentials return 401 AUTH_REQUIRED and WWW-Authenticate Bearer."
        - "Student-filter bypass applies only to exact machine method/path matches; never an internal wildcard."
        - "Disabled integration exposes no metrics controller and never yields metric data."
        - "Wrong methods, trailing path additions, and neighboring routes cannot gain access through matcher normalization."
        - "Expose aggregates only; no raw-event API or individual incoming visitor list."
    query_parameters:
      fromDate: "Required ISO date, inclusive in Asia/Seoul."
      toDate: "Required ISO date, exclusive in Asia/Seoul."
      rules:
        - "Require a positive range of at most 90 calendar days."
        - "toDate cannot exceed tomorrow's Asia/Seoul date; today's incomplete period is allowed."
        - "Invalid ranges/dates and unknown or repeated parameters return MALFORMED_REQUEST."
    operations:
      - method: "GET"
        path: "/internal/v1/academies/{academyId}/behavior-metrics/students/{studentId}/profile-visits"
        operation_id: "getIncomingProfileVisitMetrics"
        response_schema: "BehaviorProfileVisitMetrics"
        required:
          - "schemaVersion"
          - "academyId"
          - "studentId"
          - "period"
          - "asOf"
          - "coverage"
          - "visitCount"
          - "distinctVisitorCount"
          - "daily"
        fields:
          visitCount: "Eligible retained PROFILE_VISIT events targeting studentId."
          distinctVisitorCount: "Distinct actors over the entire requested period, not sum of daily distinct counts."
          daily: "Ascending item for every requested Seoul date with date, coverageStatus, visitCount, distinctVisitorCount."
        authorization:
          - "Target must currently belong to academy, otherwise PROFILE_NOT_FOUND."
          - "Each event requires current actor/target memberships and no bilateral block."
      - method: "GET"
        path: "/internal/v1/academies/{academyId}/behavior-metrics/students/{studentId}/author-interest/{authorStudentId}"
        operation_id: "getOutgoingAuthorInterestMetrics"
        response_schema: "BehaviorAuthorInterestMetrics"
        required:
          - "schemaVersion"
          - "academyId"
          - "studentId"
          - "authorStudentId"
          - "period"
          - "asOf"
          - "coverage"
          - "profileVisitCount"
          - "daily"
        fields:
          profileVisitCount: "Eligible retained PROFILE_VISIT events from studentId to authorStudentId."
          daily: "Ascending item for every requested Seoul date with date, coverageStatus, profileVisitCount."
        authorization: "Both students must currently belong to academy with no bilateral block, otherwise PROFILE_NOT_FOUND."
        provenance: "Directional author signal only; do not substitute feed clicks or infer categories."
      - method: "GET"
        path: "/internal/v1/academies/{academyId}/behavior-metrics/feed"
        operation_id: "getFeedBehaviorMetrics"
        response_schema: "BehaviorFeedMetrics"
        required:
          - "schemaVersion"
          - "academyId"
          - "period"
          - "asOf"
          - "coverage"
          - "items"
        fields:
          items: "At most 100 rows with observed eligible activity, ordered by sortSource then position."
          item_required:
            - "sortSource"
            - "position"
            - "exposureCount"
            - "clickCount"
            - "clickedExposedImpressionCount"
            - "unmatchedClickCount"
            - "ctr"
          sortSource: "Const LATEST."
          position: "Integer 0 through 99."
          exposureCount: "Eligible exposure events, equal to distinct exposed actor/impression identities."
          clickCount: "Eligible AUTHOR_PROFILE click events."
          clickedExposedImpressionCount: "Exposed actor/impression identities with at least one eligible click in period."
          unmatchedClickCount: "Click events without an eligible matching exposure in the requested period."
          ctr: "Null with zero exposureCount, otherwise clickedExposedImpressionCount divided by exposureCount."
        authorization: "Academy must exist; re-evaluate current actor/card visibility for each included event."
        joins:
          - "Match by immutable actor/impression identity also bound to context, card, and position."
          - "Exposure and click independently satisfy occurredAt interval, logical retention, and current access."
          - "Never join solely by card ID, position, timing, or arrival order."
          - "Aggregate contexts only after preserving their distinct impression identities."
          - "Multiple clicks increase clickCount but contribute at most one numerator unit per exposed impression."
    responses:
      "200": "Successful aggregate, including empty observed data with coverage."
      "400": "MALFORMED_REQUEST."
      "401": "AUTH_REQUIRED."
      "404": "ACADEMY_NOT_FOUND or PROFILE_NOT_FOUND."
    period:
      required:
        - "fromDate"
        - "toDate"
        - "timezone"
        - "fromInclusive"
        - "toExclusive"
      timezone: "Const Asia/Seoul."
      fromInclusive: "UTC instant corresponding to fromDate Seoul midnight."
      toExclusive: "UTC instant corresponding to toDate Seoul midnight."
    temporal_rules:
      - "Aggregate occurredAt in the requested half-open interval and not after one consistent asOf instant."
      - "Late arrivals can change results until toExclusive plus 24 hours; current-access changes may change them later."
      - "Logically exclude receivedAt less than or equal to asOf minus 90 days before physical cleanup."
    coverage:
      required:
        - "status"
        - "collectionStartedAt"
        - "retentionCutoffReceivedAt"
        - "fullyRetainedFrom"
        - "availableThrough"
        - "reasons"
        - "countsMeaning"
      properties:
        status: "Enum COMPLETE, PARTIAL, NONE."
        collectionStartedAt: "Durable backend collection activation instant, not first event time and not reset on process restart."
        retentionCutoffReceivedAt: "asOf minus 90 days."
        fullyRetainedFrom: "Maximum of collectionStartedAt and retentionCutoffReceivedAt plus five minutes."
        availableThrough: "asOf."
        reasons: "Unique array values BEFORE_COLLECTION, RETENTION_EXPIRED, OPEN_PERIOD."
        countsMeaning: "Const RECORDED_ELIGIBLE_EVENTS_ONLY."
      semantics:
        - "COMPLETE means requested time lies inside known backend collection and fully retained bounds; it does not prove delivery of all client activity."
        - "PARTIAL means some requested time lies outside those bounds; include applicable reasons."
        - "NONE means no overlap with those bounds and no eligible retained event contribution."
        - "The five-minute offset conservatively translates receivedAt retention into occurredAt coverage under accepted future-clock skew."
        - "Include eligible retained events outside conservative fully retained bounds, with PARTIAL coverage."
        - "Server collection activation never establishes frontend instrumentation availability."
        - "With NONE, profile totals and daily count fields are null; feed items is empty."
        - "With COMPLETE or PARTIAL, counts are observed retained integers, including zero, always interpreted with coverage."
        - "Zero asserts no eligible retained events observed; it never asserts zero unobserved real-world activity."
        - "Compute daily COMPLETE/PARTIAL/NONE independently for each requested day's interval."
        - "Never backfill from historic profile or card GET requests."
  errors:
    shape: "Existing ErrorEnvelope containing code, message, retryable, traceId, fieldErrors, and details."
    new_codes:
      - "SELF_PROFILE_VISIT"
      - "EVENT_TIME_OUT_OF_RANGE"
      - "PROFILE_NOT_FOUND"
      - "FEED_CONTEXT_NOT_FOUND"
      - "FEED_CONTEXT_EXPIRED"
      - "EVENT_ID_CONFLICT"
      - "IMPRESSION_CONFLICT"
      - "IMPRESSION_ALREADY_EXPOSED"
    rules:
      - "All new listed 4xx codes have retryable false."
      - "Preserve PHOTO_DELIVERY_UNAVAILABLE retryable true."
      - "New retryable server codes, if necessary, require corresponding ErrorEnvelope conditional-schema updates."
      - "Order checks as authentication, student role, structure, current scope authorization, retained replay resolution, then new-event time/context conditions."
      - "Not-found and conflict details never disclose original payloads, foreign actors, hidden profiles, or context/card contents."
      - "Storage and collection failures remain errors rather than successful zero metrics or fabricated acceptance."
  persistence:
    - "V14 adds actor-scoped events, contexts/items, impressions, and durable collection activation metadata."
    - "Keep immutable replay fields and referenced context/impression dependencies throughout retained-event lifetime."
    - "Remove expired events first, then unused expired impression/context dependencies in foreign-key-safe order."
    - "Run bounded scheduled cleanup at least daily with explicit batch size and run budget, repeated bounded batches, and observable backlog."
    - "Document maximum intended additional physical-deletion lag of 24 hours and report backlog/failure when this target is missed."
    - "Current authorization applies to submission, replay, and metrics; access restoration can restore retained-event contribution."
    - "Seed reset deterministically clears behavior state and collection metadata while preserving existing photo-cleanup guarantees."
