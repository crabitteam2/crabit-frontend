openapi: 3.1.0
info:
  title: Crabit API
  version: 0.0.1
  description: "소유자용 카드 잔액 계정(Card Balance Account) 및 위시(Wish) 작업과 학원용 공유 카드(Shared Card) 조회, 친구 관리(Friend Management), 잔액 조정 건(Balance Adjustment Case) 상태 표시를 제공합니다. 리소스 소유권과 현재 공개 범위는 리소스별 404 응답으로 숨깁니다. 모든 타임스탬프는 RFC 3339 UTC Z 형식이며, 모든 KRW 금액은 범위가 제한된 정수 원 단위입니다. 모든 오류 본문은 공통 ErrorEnvelope를 사용합니다."
servers:
  - url: /
tags:
  - name: Card Balance Accounts
    description: "카드 잔액 계정(Card Balance Account)의 잔액, 새로고침, 원장 이력과 잔액 조정 건(Balance Adjustment Case) 상태를 다룹니다."
  - name: Wishes
    description: "위시(Wish)의 생성, 조회, 변경, 삭제, 대표 선택과 자금 이동을 다룹니다."
  - name: Shared Cards
    description: "학원에 공개되는 공유 카드(Shared Card) 조회를 다룹니다."
  - name: Friend Management
    description: "같은 학원 학생 간 친구 관리(Friend Management)의 검색, 친구 요청, 수락·거절·취소와 차단을 다룹니다."
x-wish-mutation-photo-replay:
  appliesTo: [createWish, depositToWish, withdrawFromWish, transferWishFunds, completeWish, abandonWish, deleteWish]
  scope:
    receiptNamespace: permanent-per-authenticated-student
    ownerSource: authenticated-principal-only
    operationTargetAndRequestFingerprintPreserved: true
  receiptState:
    encoding: private-tagged-union
    wireSchemaAddition: false
    variants:
      NO_PHOTO:
        retainedFields: [kind]
        meaning: "최초 성공 스냅샷의 photo가 null이었습니다."
        replay: "나중에 현재 사진이 첨부되어도 조회하거나 대체하지 않고 최초 photo null 성공 결과를 반환합니다."
      ACTIVE_PHOTO:
        retainedFields: [kind, photoId]
        meaning: "최초 성공 스냅샷에 포함된 정확한 사진 identity가 아직 유효합니다."
        replay: "동일한 인증 학생 소유이고 캡처된 정확한 위시에 ATTACHED 상태인 같은 photoId를 재검증한 뒤 새 5분 small, medium, large URL을 모두 발급합니다."
      PHOTO_REVOKED:
        retainedFields: [kind]
        meaning: "최초 성공 스냅샷의 사진이 더 이상 유효하지 않으며 삭제된 identity는 제거되었습니다."
        replay: "Wish 성공 본문이나 사진 capability 없이 409 WISH_PHOTO_EXPIRED를 반환합니다."
    invariants:
      - "photoId는 ACTIVE_PHOTO에만 존재합니다."
      - "NO_PHOTO는 이후 현재 attachment와 무관하게 NO_PHOTO로 유지됩니다."
      - "ACTIVE_PHOTO는 PHOTO_REVOKED로만 전이할 수 있습니다."
      - "PHOTO_REVOKED는 photoId, URL, object path, digest, timestamp 또는 revocation reason을 포함하지 않는 종결 상태입니다."
    legacyCompatibility: "사진 기능 이전 receipt의 캡처된 snapshot이 photo null이고 tag가 없으면 NO_PHOTO로 해석하고 다시 기록하며 현재 attachment에서 ACTIVE_PHOTO를 추론하지 않습니다."
  capture:
    singleWish: "성공 응답의 photo가 null이면 NO_PHOTO, 존재하면 정확히 그 photoId를 가진 ACTIVE_PHOTO를 원래 status, 비사진 snapshot, event identity, occurrence time, recorded time과 함께 저장합니다."
    transfer: "sourcePhotoReplayState와 destinationPhotoReplayState를 출발·도착 snapshot에 각각 결속해 이체 결과와 원자적으로 저장합니다."
    delete: "첨부 사진을 먼저 redaction·revocation한 뒤 성공 응답을 캡처하므로 deleteWish 결과는 항상 NO_PHOTO입니다."
  replay:
    validActivePhoto: "원래 상태·version·event identity·occurrence time을 유지하고 같은 photoId와 새 5분 URL만 재구성하여 원래 201 또는 200 status로 반환합니다."
    noPhoto: "현재 attachment를 조회하거나 대체하지 않고 원래 photo null 성공 결과를 반환합니다."
    revokedPhoto: "409 WISH_PHOTO_EXPIRED, retryable false, 표준 비공개 ErrorEnvelope만 반환하고 Idempotency-Replayed를 생략합니다."
    deliveryFailure: "모든 상태가 NO_PHOTO 또는 유효한 ACTIVE_PHOTO이지만 필요한 새 URL 하나라도 발급하지 못하면 503 PHOTO_DELIVERY_UNAVAILABLE, retryable true를 반환하고 부분 성공 본문과 Idempotency-Replayed를 생략하며 receipt를 바꾸지 않습니다."
    transferAtomicity: "두 캡처 상태를 URL 발급 전에 함께 평가합니다. 한쪽이라도 PHOTO_REVOKED이면 전체 재생을 WISH_PHOTO_EXPIRED로 실패시키고 다른 쪽 URL이나 부분 본문을 반환하지 않습니다."
    successHeaders: "성공한 일치 재생에만 Idempotency-Replayed true와 Cache-Control no-store를 반환합니다."
  atomicRedaction:
    triggers: [photoReplacement, explicitPhotoRemoval, pendingPhotoCancellation, pendingPhotoExpiry, wishDeletion, DELETE_PENDING, hardCleanup, integrityRepair]
    rule: "사진이 접근 불가능해지기 전에 소유자의 모든 create, deposit, withdrawal, transfer, completion, abandonment, delete receipt에서 같은 photoId인 ACTIVE_PHOTO를 한 원자적 update로 식별자 없는 PHOTO_REVOKED로 바꿉니다. 실패하면 revocation 또는 destructive cleanup도 rollback합니다."
    cleanupGuard: "어떤 소유자 mutation receipt에도 대상 photoId의 ACTIVE_PHOTO가 남아 있으면 object나 photo row를 삭제하지 않습니다. cleanup은 같은 잠금 아래에서 누락된 참조를 먼저 PHOTO_REVOKED로 복구합니다."
  lockOrder:
    - owner-mutation-receipt-namespace
    - wish-photo-upload-receipts-by-owner-key-photo-id
    - wish-photo-rows-by-ascending-photo-uuid
    - cleanup-work-rows
  concurrency:
    invariant: "mutation receipt photo state, upload receipt, photo row를 함께 다루는 모든 경로는 receipt 또는 receipt namespace를 먼저 잠그며 photo를 잠근 뒤 receipt를 잠그지 않습니다."
    discoveryAndRevalidation: "cancel, detach, replacement, expiry, cleanup은 소유자와 key 발견에 non-locking read를 사용할 수 있지만 정해진 잠금을 얻은 뒤 owner, photoId, state, attachment, replay-state match, retainUntil을 다시 검증합니다."
    linearizedOutcomes:
      replayFirst: "재생이 owner receipt namespace lock을 먼저 얻고 ACTIVE_PHOTO가 유효하면 원래 identity와 새 5분 URL로 성공합니다. 뒤따르는 revocation은 사진 상태를 바꾸기 전에 모든 일치 참조를 PHOTO_REVOKED로 redaction합니다."
      revocationFirst: "취소, 교체, 제거, 만료, Wish 삭제 또는 cleanup이 먼저 잠그면 upload receipt와 모든 Wish mutation replay state를 먼저 revoke·redact하고 뒤따르는 재생은 WISH_PHOTO_EXPIRED입니다."
      failureBoundary: "어느 순서도 PostgreSQL deadlock, current-photo substitution, deleted photoId retention, partial transfer capability 또는 문서화되지 않은 응답을 만들 수 없습니다."
  privacy:
    forbiddenReceiptData: [signedUrl, urlExpiry, bucket, objectPath, imageBytes, filename, multipartData, photoDigest, safetyProviderDetail, currentAttachmentAtReplay]
    forbiddenErrorData: [photoId, signedUrl, objectPath, contentDigest, retainedSnapshot, receiptState, revocationReason, currentAttachment]
  frontendBoundary:
    excludedBackendErrorCode: BFF_REQUEST_TIMEOUT
    rule: "408 BFF_REQUEST_TIMEOUT은 frontend BFF envelope code이며 backend ErrorCode enum에 추가하지 않습니다."
paths:
  /v1/me/card-balance-accounts:
    get:
      tags: [Card Balance Accounts]
      operationId: listMyCardBalanceAccounts
      summary: "인증된 학생의 카드 잔액 계정 목록 조회"
      description: "UNKNOWN 잔액은 임의로 0을 만들지 않고 null로 유지합니다. 각 계정은 계정 범위의 잔액 조정 건(Balance Adjustment Case)이 현재 OPEN인지도 함께 표시합니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "조회 가능한 카드 잔액 계정입니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardBalanceAccountPage'}
              examples:
                unknown-balance: {$ref: '#/components/examples/UnknownBalancePage'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/card-balance-accounts/{cardBalanceAccountId}:
    parameters: [{$ref: '#/components/parameters/CardBalanceAccountId'}]
    get:
      tags: [Card Balance Accounts]
      operationId: getCardBalanceAccount
      summary: "소유한 카드 잔액 계정 조회"
      description: "현재 저장된 프로젝션에서 인증된 학생의 활성 계정을 반환합니다. 임의 식별자, 종료된 계정, 소유권 불일치, 학원 불일치는 모두 같은 리소스 없음 응답으로 숨깁니다. 이 작업은 외부 잔액 조회를 수행하지 않으며 영속 상태를 변경하지 않습니다. UNKNOWN 금액은 null로 유지합니다. 조회에 성공한 뒤 후속 시도가 실패하면 lastRefreshStatus는 FAILED로 표시하되, 마지막으로 성공한 금액과 lastRefreshedAt은 유지합니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "현재 저장된 카드 잔액 계정 프로젝션입니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardBalanceAccount'}
              examples:
                unknown:
                  summary: "저장된 UNKNOWN 잔액"
                  x-schema-ref: '#/components/schemas/UnknownCardBalanceAccount'
                  value:
                    cardBalanceAccountId: 09551375-f69a-4e69-8587-a0d590cbf092
                    academyId: a12c54ad-c8a2-4102-a03b-28fe4a0daaa7
                    balanceKnowledge: UNKNOWN
                    actualCardBalance: null
                    ledgerAvailableBalance: null
                    displayAvailableBalance: null
                    unresolvedShortage: null
                    balanceAdjustmentInProgress: false
                    lastRefreshStatus: null
                    lastRefreshedAt: null
                failed-refresh-known: {$ref: '#/components/examples/FailedRefreshKnownBalance'}
                adjustment-open-known: {$ref: '#/components/examples/KnownBalanceAdjustmentOpen'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CardBalanceAccountNotFound'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/representative-wish:
    parameters: [{$ref: '#/components/parameters/CardBalanceAccountId'}]
    get:
      tags: [Wishes]
      operationId: getRepresentativeWish
      summary: "현재 대표 위시 조회"
      description: "현재 선택을 확인하기 전에 인증된 학생과, 그 학생이 소유한 같은 학원의 활성 카드 잔액 계정을 검증합니다. 선택된 삭제되지 않은 IN_PROGRESS 또는 AMOUNT_REACHED 위시는 기존 위시 스냅샷 형식으로 직접 반환합니다. 유효한 계정에 대표 위시가 없으면 본문 없이 204를 반환합니다. 잔액 조정 건이 OPEN이어도 조회할 수 있으며, 외부 잔액을 조회하거나 영속 상태를 변경하지 않습니다. 열린 계정에 활성 상태의 삭제되지 않은 위시가 정확히 하나면 해당 위시를 대표로 선택합니다. 두 번째 활성 위시를 만들어도 기존 대표는 유지합니다. 대표 위시가 완료·포기·삭제되면 기존 선택을 제거하고, 활성 상태의 삭제되지 않은 위시가 정확히 하나 남았을 때만 다른 위시를 자동 선택합니다. 계정을 종료하면 선택이 제거되고 이 작업은 CARD_BALANCE_ACCOUNT_NOT_FOUND를 반환합니다. 대표 선택은 소유 위시 정렬, 위시 공개 범위, 공유 카드, 피드 정렬, 알림, 원장 이력, 계정 잔액을 변경하지 않습니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "현재 대표 위시입니다."
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Wish'}
              examples:
                representative-during-balance-mismatch: {$ref: '#/components/examples/RepresentativeWishDuringBalanceMismatch'}
        '204':
          description: "유효한 계정에 현재 대표 위시가 없습니다."
        '400': {$ref: '#/components/responses/MalformedRequest'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CardBalanceAccountNotFound'}
        '503': {$ref: '#/components/responses/PhotoDeliveryUnavailable'}
    put:
      tags: [Wishes]
      operationId: selectRepresentativeWish
      summary: "대표 위시 선택"
      description: "계정의 기존 대표를 지정한 동일 계정의 활성 위시로 원자적으로 교체합니다. 현재 대표를 다시 선택하면 변경 없이 200으로 성공하며 위시의 updatedAt과 version을 유지합니다. 잔액 조정 건이 OPEN이어도 선택할 수 있고, 원장 이벤트, 알림 아웃박스 항목, 선택 이력, 위시 변경을 만들지 않습니다. 동시 선택은 계정 우선 잠금으로 직렬화됩니다. 마지막으로 커밋된 선택이 최종 선택이며, 성공 응답에는 각 요청이 커밋 시점에 선택한 위시가 담깁니다. 오류 우선순위는 고정됩니다. Bearer 자격 증명이 없거나 유효하지 않으면 401 AUTH_REQUIRED, 인증 주체가 학생이 아니면 403 FORBIDDEN을 반환합니다. 경로 UUID나 JSON 본문이 잘못되었거나, wishId가 없거나 타입이 잘못되었거나, 알 수 없는 요청 필드가 있으면 400 MALFORMED_REQUEST를 반환합니다. 계정이 없거나 종료되었거나 본인 소유가 아니거나 다른 학원 소속이면 위시 적격성을 공개하기 전에 404 CARD_BALANCE_ACCOUNT_NOT_FOUND를 반환합니다. 유효한 계정에서 위시가 없거나 논리 삭제되었거나 다른 계정 소속이면 수명 주기 상태와 관계없이 404 WISH_NOT_FOUND를 반환합니다. 동일 계정의 COMPLETED 또는 ABANDONED 위시는 409 INVALID_STATE_TRANSITION을 반환합니다. 비공개 위시와 현재 대표를 포함해 동일 계정의 IN_PROGRESS 또는 AMOUNT_REACHED 위시는 성공합니다. 선택은 소유 위시 정렬, 위시 공개 범위, 공유 카드, 피드 정렬, 알림, 원장 이력, 계정 잔액을 변경하지 않습니다."
      security: [{SyntheticBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RepresentativeWishSelectionRequest'}
            examples:
              atomic-selection:
                summary: "원자 선택"
                value: {wishId: 341ab749-bbab-4b08-9334-0e4b12347b48}
      responses:
        '200':
          description: "선택된 대표 위시는 변경 결과 래퍼나 eventId 없이 직접 반환됩니다."
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Wish'}
              examples:
                atomic-selection: {$ref: '#/components/examples/RepresentativeWishSelected'}
                same-selection-noop: {$ref: '#/components/examples/RepresentativeWishSameSelectionNoop'}
        '400': {$ref: '#/components/responses/MalformedRequest'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WishOrAccountNotFound'}
        '409': {$ref: '#/components/responses/RepresentativeWishSelectionConflict'}
        '415': {$ref: '#/components/responses/JsonUnsupportedMediaType'}
        '503': {$ref: '#/components/responses/PhotoDeliveryUnavailable'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/balance-refreshes:
    parameters: [{$ref: '#/components/parameters/CardBalanceAccountId'}]
    post:
      tags: [Card Balance Accounts]
      operationId: refreshCardBalance
      summary: "현재 카드 잔액 새로고침"
      description: "본문이 없는 USER_REQUESTED 조회입니다. 이 작업은 의도적으로 Idempotency-Key를 사용하지 않으며 잔액 조정 건이 OPEN이어도 허용됩니다. 응답은 처리 결과의 현재 조정 상태 플래그를 반환합니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "성공적인 현재 잔액 관측입니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BalanceRefreshResult'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CardBalanceAccountNotFound'}
        '503': {$ref: '#/components/responses/BalanceSyncFailed'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/card-balance-changes:
    parameters: [{$ref: '#/components/parameters/CardBalanceAccountId'}]
    get:
      tags: [Card Balance Accounts]
      operationId: listCardBalanceChanges
      summary: "변동액이 0이 아닌 불변 카드 잔액 변경 이력 조회"
      description: "변동액이 0 아닌 CARD_BALANCE_CHANGE 원장 이벤트를 만든 성공 관측만 반환합니다. 실패한 관측과 성공했지만 변동액이 0인 관측은 저장된 운영 사실로 남지만 금액 이력 항목은 아닙니다. 결과는 occurredAt DESC, eventId DESC 순으로 정렬합니다. 불투명 커서는 이 작업, 계정, 정렬 버전, 마지막 (occurredAt, eventId) 튜플에 바인딩됩니다. 유효하지 않거나 바인딩이 일치하지 않는 커서는 부분 페이지 없이 400을 반환합니다. 다음 페이지는 마지막 튜플보다 엄격히 뒤에 이어지며, eventId가 같은 타임스탬프의 순서를 안정화하므로 경계 앞에 정렬되는 새 이벤트가 생겨도 연속 지점은 바뀌지 않습니다. 유효한 커서에는 유효한 limit 값을 함께 사용할 수 있습니다. 권한과 소유권은 요청할 때마다 다시 평가하며 캐시 가능성을 보장하지 않습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "0이 아닌 불변의 카드 잔액 이벤트 내역입니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardBalanceChangePage'}
              examples:
                card-balance-change: {$ref: '#/components/examples/CardBalanceChangePageExample'}
        '400': {$ref: '#/components/responses/MalformedRequest'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CardBalanceAccountNotFound'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/fund-movements:
    parameters: [{$ref: '#/components/parameters/CardBalanceAccountId'}]
    get:
      tags: [Card Balance Accounts]
      operationId: listAccountFundMovements
      summary: "계정 단위 불변 자금 이동 이력 조회"
      description: "외부 카드 잔액 변경과 모든 위시 자금 이동을 포함해 불변 원장 이벤트마다 항목 하나를 반환합니다. 위시 이체는 두 위시 효과를 갖지만 계정 이력에서는 항목 하나입니다. 결과는 occurredAt DESC, eventId DESC 순으로 정렬합니다. 불투명 커서는 이 작업, 계정, 정렬 버전, 마지막 튜플에 바인딩됩니다. 형식이 잘못되었거나 바인딩이 일치하지 않는 커서는 부분 페이지 없이 400을 반환합니다. 다음 페이지는 마지막 튜플보다 엄격히 뒤에 이어지며, eventId가 같은 타임스탬프의 순서를 안정화하므로 경계 앞에 정렬되는 새 이벤트가 생겨도 연속 지점은 바뀌지 않습니다. 유효한 커서에는 유효한 limit 값을 함께 사용할 수 있습니다. 보정은 새 보상 이벤트로 기록하며 이전 이벤트를 수정하거나 삭제하지 않습니다. 권한과 소유권은 요청할 때마다 다시 평가하며 캐시 가능성을 보장하지 않습니다."
      security: [{SyntheticBearer: []}]
