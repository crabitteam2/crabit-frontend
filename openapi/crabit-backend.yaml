          then:
            properties:
              generationVersion: {type: "null"}
              algorithmVersion: {type: "null"}
              generatedAt: {type: "null"}
              result: {type: "null"}
        - if:
            properties: {status: {enum: [GENERATING, FAILED]}}
            required: [status]
          then:
            properties:
              generationVersion: {type: integer, minimum: 1, maximum: 9007199254740991}
              algorithmVersion: {type: string, const: recap-1}
              generatedAt: {type: "null"}
              result: {type: "null"}
        - if:
            properties: {status: {const: NOT_ELIGIBLE}}
            required: [status]
          then:
            properties:
              generationVersion: {type: integer, minimum: 1, maximum: 9007199254740991}
              algorithmVersion: {type: string, const: recap-1}
              generatedAt: {$ref: '#/components/schemas/UtcInstant'}
              result: {type: "null"}
        - if:
            properties: {status: {const: SUCCEEDED}}
            required: [status]
          then:
            properties:
              generationVersion: {type: integer, minimum: 1, maximum: 9007199254740991}
