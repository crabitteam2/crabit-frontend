        - "schemaVersion"
        - "academyId"
        - "period"
        - "asOf"
        - "coverage"
        - "items"
      properties:
        schemaVersion:
          type: "integer"
          description: "내부 지표 계약 버전입니다."
          const: 1
        academyId:
          $ref: "#/components/schemas/Uuid"
          description: "조회 대상 학원 UUID입니다."
        period:
          $ref: "#/components/schemas/BehaviorMetricPeriod"
          description: "조회한 서울 날짜 반개구간입니다."
        asOf:
          $ref: "#/components/schemas/UtcInstant"
          description: "발생 시각 상한과 보존 판정에 쓰는 한 번의 일관된 조회 시각입니다."
        coverage:
          $ref: "#/components/schemas/BehaviorMetricCoverage"
          description: "수집 가능성과 논리 보존 상태를 수치와 함께 해석합니다."
        items:
          type: "array"
          description: "관측된 유효 활동이 있는 행만 sortSource, position 오름차순으로 반환합니다. NONE이면 빈 배열입니다."
          items:
            $ref: "#/components/schemas/BehaviorFeedMetricItem"
          maxItems: 100
      allOf:
        - if:
            properties:
              coverage:
                properties:
                  status:
                    const: "NONE"
          then:
            properties:
              items:
                maxItems: 0
    Uuid:
      type: string
      format: uuid
    UtcInstant:
      type: string
      format: date-time
      pattern: 'Z$'
      description: "와이어 표현이 Z로 끝나는 RFC 3339 UTC 시점입니다."
    UtcDate:
      type: string
      format: date
    Cursor:
      type: string
      minLength: 1
    KrwSigned:
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: "소수 단위의 KRW 금액은 절대 허용하지 않습니다."
    KrwNonNegative:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    KrwPositive:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    WishVersion:
      type: integer
      format: int64
      minimum: 0
      description: "필수 요청 버전이 없거나 정수가 아니면 400 MALFORMED_REQUEST를 반환합니다. 디코딩된 버전이 음수이면 422 INVALID_VERSION, 음수가 아니지만 최신 버전과 다르면 409 VERSION_CONFLICT를 반환합니다."
    Purpose:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^(?!\p{Zs})(?!.*\p{Zs}$)(?!.*[\p{Cc}\p{Cf}\p{Zl}\p{Zp}]).+$'
      description: "NFC로 정규화되고 앞뒤 경계 공백이 없으며 1~200개의 유니코드 코드 포인트를 포함하는 텍스트입니다. Cc, Cf, Zl, Zp 문자는 금지하고 내부 Space_Separator 문자는 유지합니다."
    PurposeInput:
      type: string
      description: "purpose 요청은 다음 순서로 정규화합니다.

        1. 요청 값을 문자열로 디코딩합니다.

        2. 디코딩된 입력 어디에든 유니코드 일반 범주 Cc, Cf, Zl, Zp가 있으면 422 INVALID_PURPOSE로 거부합니다.

        3. ASCII SPACE와 NBSP U+00A0을 포함한 앞뒤의 모든 유니코드 Space_Separator 코드 포인트(일반 범주 Zs)를 반복해서 제거하되 내부 공백은 유지합니다.

        4. 경계 공백을 제거한 값을 유니코드 NFC로 정규화합니다.

        5. NFC 정규화 후 유니코드 코드 포인트 수를 셉니다. 1~200개이면 저장하고 반환하며, 그 밖의 경우 422 INVALID_PURPOSE를 반환합니다."
    WishState:
      type: string
      enum: [IN_PROGRESS, AMOUNT_REACHED, COMPLETED, ABANDONED]
    WishVisibility:
      type: string
      enum: [PRIVATE, FOLLOWERS, ACADEMY]
      description: 위시 공개 범위입니다. PRIVATE는 비공개, FOLLOWERS는 현재 viewer → owner 팔로우, ACADEMY는 기존 학원 공개 규칙입니다. 제거된 이전 공개 범위 값은 기존 enum 입력 오류인 400 MALFORMED_REQUEST입니다. FOLLOWERS는 선택 학원의 현재 viewer → owner 팔로우가 있어야 비소유자에게 공개됩니다. owner → viewer만으로는 공개되지 않으며 상호 팔로우는 필요하지 않습니다. 진행·완료 공유 카드의 목록·상세에 동일하게 적용합니다. 기존 소유자 예외, PRIVATE·ACADEMY 의미, 현재 학원 소속, 공유 카드의 카드 계정 자격과 종결 상태 필터, 전역 양방향 차단 우선순위를 유지합니다. 언팔로우·차단 후 다음 조회부터 제한된 카드를 숨기며 직접 조회는 SHARED_CARD_NOT_FOUND 경계를 유지합니다.
    BalanceLookupMethod:
      type: string
      enum: [USER_REQUESTED, PRE_DEPOSIT, AUTO_DAILY]
    LedgerEventType:
      type: string
      enum: [CARD_BALANCE_CHANGE, WISH_DEPOSIT, WISH_WITHDRAWAL, WISH_TRANSFER, WISH_COMPLETION_RETURN, WISH_ABANDONMENT_RETURN, WISH_DELETION_RETURN]
    BalanceAdjustmentStatus:
      type: string
      enum: [OPEN, RESOLVED]
      description: "내부 계정 조정 상태 어휘는 소유자 오류 세부 정보에만 사용되며 공유 카드 프로젝션에는 사용되지 않습니다."
    ErrorCode:
      type: string
      enum:
        - SELF_PROFILE_VISIT
        - EVENT_TIME_OUT_OF_RANGE
        - PROFILE_NOT_FOUND
        - FEED_CONTEXT_NOT_FOUND
        - FEED_CONTEXT_EXPIRED
        - EVENT_ID_CONFLICT
        - IMPRESSION_CONFLICT
        - IMPRESSION_ALREADY_EXPOSED
        - MALFORMED_REQUEST
        - EXPECTED_VERSION_REQUIRED
        - IDEMPOTENCY_KEY_REQUIRED
        - AUTH_REQUIRED
        - FORBIDDEN
        - CARD_BALANCE_ACCOUNT_NOT_FOUND
        - WISH_NOT_FOUND
        - ACADEMY_NOT_FOUND
        - SHARED_CARD_NOT_FOUND
        - VERSION_CONFLICT
        - INVALID_STATE_TRANSITION
        - BALANCE_MISMATCH_LOCKED
        - INSUFFICIENT_AVAILABLE_BALANCE
        - INSUFFICIENT_WISH_AMOUNT
        - TARGET_AMOUNT_EXCEEDED
        - CROSS_ACCOUNT_TRANSFER_FORBIDDEN
        - IDEMPOTENCY_KEY_REUSED
        - UNSUPPORTED_MEDIA_TYPE
        - INVALID_AMOUNT
        - INVALID_PURPOSE
        - INVALID_DATE_RANGE
        - INVALID_VERSION
        - BALANCE_SYNC_FAILED
        - RECAP_QUERY_UNAVAILABLE
        - STUDENT_NOT_FOUND
        - STUDENT_BLOCK_NOT_FOUND
        - SELF_RELATIONSHIP
        - STUDENT_BLOCK_ALREADY_ACTIVE
        - WISH_PHOTO_NOT_FOUND
        - WISH_PHOTO_EXPIRED
        - WISH_PHOTO_ALREADY_ATTACHED
        - PHOTO_TOO_LARGE
        - UNSUPPORTED_PHOTO_TYPE
        - INVALID_PHOTO
        - PHOTO_CONTENT_NOT_ALLOWED
        - PHOTO_UPLOAD_RATE_LIMITED
        - PHOTO_PROCESSING_UNAVAILABLE
        - PHOTO_DELIVERY_UNAVAILABLE
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: {type: string, minLength: 1, description: "이 유효성 검사 실패와 관련된 잘못된 요청 필드, 매개 변수 또는 헤더의 이름입니다."}
        message: {type: string, minLength: 1, description: "해당 필드 오류를 사람이 읽을 수 있게 설명한 문장입니다."}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          description: "선언된 모든 실패 JSON 응답이 공통으로 사용하는 구조화된 오류 페이로드입니다."
          type: object
          additionalProperties: false
          required: [code, message, retryable, traceId, fieldErrors, details]
          allOf:
            - if:
                properties:
                  code:
                    enum: [BALANCE_SYNC_FAILED, RECAP_QUERY_UNAVAILABLE, PHOTO_UPLOAD_RATE_LIMITED, PHOTO_PROCESSING_UNAVAILABLE, PHOTO_DELIVERY_UNAVAILABLE]
              then:
                properties:
                  retryable: {const: true}
              else:
                properties:
                  retryable: {const: false}
          properties:
            code: {$ref: '#/components/schemas/ErrorCode', description: "안정적으로 기계 판독할 수 있는 ErrorCode입니다. 클라이언트는 message 텍스트가 아니라 이 값으로 분기해야 합니다."}
            message: {type: string, minLength: 1, description: "이번 오류 발생을 사람이 읽을 수 있게 설명한 문장입니다. 안정적인 기계 판정 키가 아닙니다."}
            retryable:
              type: boolean
              description: "BALANCE_SYNC_FAILED, RECAP_QUERY_UNAVAILABLE, PHOTO_UPLOAD_RATE_LIMITED, PHOTO_PROCESSING_UNAVAILABLE, PHOTO_DELIVERY_UNAVAILABLE일 때만 true입니다. 정의된 그 밖의 클라이언트, 인가, 리소스 없음, 유효성 검사, 상태 충돌 오류에는 false입니다."
            traceId: {type: string, minLength: 1, description: "진단과 지원에 사용하는 불투명한 서버 상관관계 식별자입니다. 도메인 의미는 없습니다."}
            fieldErrors:
              description: "필드별 유효성 검사 실패 목록입니다. 오류 원인을 개별 요청 필드에 연결할 수 없으면 비어 있습니다."
              type: array
              items: {$ref: '#/components/schemas/FieldError'}
            details:
              description: "오류 코드별로 확장할 수 있는 메타데이터 객체입니다. 적용할 세부 정보가 없으면 비어 있으며 클라이언트는 알 수 없는 키를 무시해야 합니다. 사진 오류에는 raw·transformed bytes, Base64, multipart content, filename, photoId, receipt outcome, retainUntil, signed URL, bucket, object path, content digest, 이미지 메타데이터, traceId 외 사진 내부 정보, 콘텐츠 안전성 category·likelihood 또는 provider payload를 절대 담지 않습니다. WISH_PHOTO_EXPIRED, IDEMPOTENCY_KEY_REUSED, PHOTO_PROCESSING_UNAVAILABLE, PHOTO_DELIVERY_UNAVAILABLE은 빈 details 객체를 반환합니다."
              type: object
              additionalProperties: true
    RecapPeriod:
      type: object
      additionalProperties: false
      required: [startDate, endDateExclusive, timezone]
      properties:
        startDate:
          type: string
          format: date
          description: "선택한 리캡 기간의 Asia/Seoul 포함 시작일입니다."
        endDateExclusive:
