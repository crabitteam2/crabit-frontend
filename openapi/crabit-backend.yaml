        eventType: {type: string, const: WISH_TRANSFER, description: "항상 WISH_TRANSFER이며 동일 계정 위시의 원자적 이체에서 한쪽 효과를 식별합니다."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "이체의 두 불변 위시 효과가 공유하는 RFC 3339 UTC Z 시점입니다."}
        wishPurposeSnapshot: {$ref: '#/components/schemas/Purpose', description: "이체가 발생했을 때 이 위시의 원장 효과에 캡처된 불변 목적입니다."}
        direction: {type: string, enum: [SOURCE, DESTINATION], description: "이 위시가 자금을 보냈으면 음수 wishAmountDelta를 갖는 SOURCE이고, 자금을 받았으면 양수 wishAmountDelta를 갖는 DESTINATION입니다."}
        counterpartyWish: {$ref: '#/components/schemas/WishHistoryReference', description: "이체 상대 위시의 이벤트 시점 목적과 조회 시점 논리 삭제 맥락입니다."}
        wishAmountDelta: {$ref: '#/components/schemas/KrwSigned', description: "이 위시에 대한 부호 있는 정수 KRW 효과: SOURCE의 경우 음수이고 DESTINATION의 경우 양수입니다."}
        wishAmountAfter: {$ref: '#/components/schemas/KrwNonNegative', description: "이체 직후 이 위시가 보유한 음수가 아닌 정수 KRW입니다."}
        correctionOfEventId: {type: [string, 'null'], format: uuid, description: "이 새 이벤트가 보상하는 이전의 불변 동일 계정 이벤트이며, 보상 대상이 없으면 null입니다."}
        balanceAdjustment:
          description: "잔액 조정 건과 연결된 불변 이벤트 출처 정보이며, 연결된 잔액 조정 건이 없으면 null입니다."
          oneOf: [{$ref: '#/components/schemas/BalanceAdjustmentEventReference'}, {type: 'null'}]
    WishCompletionReturnMovement:
      type: object
