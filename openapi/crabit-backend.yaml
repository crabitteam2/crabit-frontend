  schemas:
    Uuid:
      type: string
      format: uuid
    UtcInstant:
      type: string
      format: date-time
      pattern: 'Z$'
      description: "와이어 표현이 Z로 끝나는 RFC 3339 UTC 시점입니다."
    UtcDate:
      type: string
      format: date
    Cursor:
      type: string
      minLength: 1
    KrwSigned:
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: "소수 단위의 KRW 금액은 절대 허용하지 않습니다."
    KrwNonNegative:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    KrwPositive:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    WishVersion:
      type: integer
      format: int64
      minimum: 0
      description: "필수 요청 버전이 없거나 정수가 아니면 400 MALFORMED_REQUEST를 반환합니다. 디코딩된 버전이 음수이면 422 INVALID_VERSION, 음수가 아니지만 최신 버전과 다르면 409 VERSION_CONFLICT를 반환합니다."
    Purpose:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^(?!\p{Zs})(?!.*\p{Zs}$)(?!.*[\p{Cc}\p{Cf}\p{Zl}\p{Zp}]).+$'
      description: "NFC로 정규화되고 앞뒤 경계 공백이 없으며 1~200개의 유니코드 코드 포인트를 포함하는 텍스트입니다. Cc, Cf, Zl, Zp 문자는 금지하고 내부 Space_Separator 문자는 유지합니다."
    PurposeInput:
      type: string
      description: "purpose 요청은 다음 순서로 정규화합니다.\n1. 요청 값을 문자열로 디코딩합니다.\n2. 디코딩된 입력 어디에든 유니코드 일반 범주 Cc, Cf, Zl, Zp가 있으면 422 INVALID_PURPOSE로 거부합니다.\n3. ASCII SPACE와 NBSP U+00A0을 포함한 앞뒤의 모든 유니코드 Space_Separator 코드 포인트(일반 범주 Zs)를 반복해서 제거하되 내부 공백은 유지합니다.\n4. 경계 공백을 제거한 값을 유니코드 NFC로 정규화합니다.\n5. NFC 정규화 후 유니코드 코드 포인트 수를 셉니다. 1~200개이면 저장하고 반환하며, 그 밖의 경우 422 INVALID_PURPOSE를 반환합니다."
    WishState:
      type: string
      enum: [IN_PROGRESS, AMOUNT_REACHED, COMPLETED, ABANDONED]
    WishVisibility:
      type: string
      enum: [PRIVATE, FRIENDS, ACADEMY]
    BalanceLookupMethod:
      type: string
      enum: [USER_REQUESTED, PRE_DEPOSIT, AUTO_DAILY]
    LedgerEventType:
      type: string
      enum: [CARD_BALANCE_CHANGE, WISH_DEPOSIT, WISH_WITHDRAWAL, WISH_TRANSFER, WISH_COMPLETION_RETURN, WISH_ABANDONMENT_RETURN, WISH_DELETION_RETURN]
    BalanceAdjustmentStatus:
      type: string
      enum: [OPEN, RESOLVED]
      description: "내부 계정 조정 상태 어휘는 소유자 오류 세부 정보에만 사용되며 공유 카드 프로젝션에는 사용되지 않습니다."
    ErrorCode:
      type: string
      enum:
        - MALFORMED_REQUEST
        - EXPECTED_VERSION_REQUIRED
        - IDEMPOTENCY_KEY_REQUIRED
        - AUTH_REQUIRED
        - FORBIDDEN
        - CARD_BALANCE_ACCOUNT_NOT_FOUND
        - WISH_NOT_FOUND
        - ACADEMY_NOT_FOUND
        - SHARED_CARD_NOT_FOUND
        - VERSION_CONFLICT
        - INVALID_STATE_TRANSITION
        - BALANCE_MISMATCH_LOCKED
        - INSUFFICIENT_AVAILABLE_BALANCE
        - INSUFFICIENT_WISH_AMOUNT
        - TARGET_AMOUNT_EXCEEDED
        - CROSS_ACCOUNT_TRANSFER_FORBIDDEN
        - IDEMPOTENCY_KEY_REUSED
        - UNSUPPORTED_MEDIA_TYPE
        - INVALID_AMOUNT
        - INVALID_PURPOSE
        - INVALID_VERSION
        - BALANCE_SYNC_FAILED
        - STUDENT_NOT_FOUND
        - FRIENDSHIP_NOT_FOUND
        - FRIEND_REQUEST_NOT_FOUND
        - STUDENT_BLOCK_NOT_FOUND
        - SELF_RELATIONSHIP
        - ALREADY_FRIENDS
        - FRIEND_REQUEST_ALREADY_PENDING
        - INCOMING_FRIEND_REQUEST_PENDING
        - FRIEND_REQUEST_NOT_PENDING
        - FRIEND_REQUEST_NOT_ACTIONABLE
        - STUDENT_BLOCK_ALREADY_ACTIVE
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: {type: string, minLength: 1, description: "이 유효성 검사 실패와 관련된 잘못된 요청 필드, 매개 변수 또는 헤더의 이름입니다."}
        message: {type: string, minLength: 1, description: "해당 필드 오류를 사람이 읽을 수 있게 설명한 문장입니다."}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          description: "선언된 모든 실패 JSON 응답이 공통으로 사용하는 구조화된 오류 페이로드입니다."
          type: object
          additionalProperties: false
          required: [code, message, retryable, traceId, fieldErrors, details]
          allOf:
            - if:
                properties:
                  code: {const: BALANCE_SYNC_FAILED}
              then:
                properties:
                  retryable: {const: true}
              else:
                properties:
                  retryable: {const: false}
          properties:
            code: {$ref: '#/components/schemas/ErrorCode', description: "안정적으로 기계 판독할 수 있는 ErrorCode입니다. 클라이언트는 message 텍스트가 아니라 이 값으로 분기해야 합니다."}
            message: {type: string, minLength: 1, description: "이번 오류 발생을 사람이 읽을 수 있게 설명한 문장입니다. 안정적인 기계 판정 키가 아닙니다."}
            retryable:
              type: boolean
              description: "BALANCE_SYNC_FAILED일 때만 true입니다. 정의된 모든 클라이언트, 인가, 리소스 없음, 유효성 검사, 상태 충돌 오류에는 false입니다."
            traceId: {type: string, minLength: 1, description: "진단과 지원에 사용하는 불투명한 서버 상관관계 식별자입니다. 도메인 의미는 없습니다."}
            fieldErrors:
              description: "필드별 유효성 검사 실패 목록입니다. 오류 원인을 개별 요청 필드에 연결할 수 없으면 비어 있습니다."
              type: array
              items: {$ref: '#/components/schemas/FieldError'}
            details:
              description: "오류 코드별로 확장할 수 있는 메타데이터 객체입니다. 적용할 세부 정보가 없으면 비어 있으며 클라이언트는 알 수 없는 키를 무시해야 합니다."
              type: object
              additionalProperties: true
    RelationshipState:
      type: string
      enum: [NONE, FRIEND, OUTGOING_PENDING, INCOMING_PENDING]
      description: "인증된 학생과 같은 학원 검색 결과 학생 사이의 현재 관계이며 응답 조회 시점에 계산합니다."
    FriendRequestStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, CANCELED]
      description: "친구 요청의 현재 수명 주기 상태입니다. 처리된 요청은 절대 PENDING으로 돌아가지 않습니다."
    StudentSummary:
      type: object
      additionalProperties: false
      required: [studentId, nickname]
      description: "실명, 카드 데이터, 위시 데이터, 인증 데이터, 학원 구성원 내부 정보를 제외한 개인정보 최소화 학생 프로젝션입니다."
      properties:
        studentId: {$ref: '#/components/schemas/Uuid', description: "프로젝션에 포함된 상대 학생의 안정적인 UUID입니다."}
        nickname: {type: string, minLength: 1, maxLength: 80, description: "현재 학생 닉네임이며 공백 문자열이 아니고 최대 80개의 유니코드 코드 포인트를 포함합니다."}
    StudentRelationship:
      type: object
      additionalProperties: false
      required: [studentId, nickname, relationshipState]
      properties:
        studentId: {$ref: '#/components/schemas/Uuid', description: "동일 학원 검색 결과의 안정적인 UUID입니다."}
        nickname: {type: string, minLength: 1, maxLength: 80, description: "결정적인 검색 정렬에 사용하는 현재의 비어 있지 않은 닉네임입니다."}
        relationshipState: {$ref: '#/components/schemas/RelationshipState', description: "인증된 학생에 대해 정확히 하나의 현재 관계 상태가 계산됩니다."}
    StudentRelationshipPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "본인, 현재 학원 구성원이 아닌 학생, 양방향 차단 대상을 제외한 같은 학원 검색 결과입니다. nickname ASC, studentId ASC 순으로 정렬합니다."
          type: array
          items: {$ref: '#/components/schemas/StudentRelationship'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "최종 반환된 (닉네임, studentId) 튜플 및 정규화된 닉네임 필터에서 파생된 불투명 커서입니다. 더 이상 항목이 없으면 null입니다."}
    Friend:
      type: object
      additionalProperties: false
      required: [studentId, nickname, friendsSince]
      properties:
        studentId: {$ref: '#/components/schemas/Uuid', description: "현재 친구의 안정적인 UUID입니다."}
        nickname: {type: string, minLength: 1, maxLength: 80, description: "현재 친구 닉네임이며 공백 문자열이 아닙니다."}
        friendsSince: {$ref: '#/components/schemas/UtcInstant', description: "현재 친구 관계가 생성되거나 재개된 RFC 3339 UTC Z 시점입니다."}
    FriendPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "현재 학원 친구는 friendsSince 내림차순, studentId 내림차순으로 정렬됩니다."
          type: array
          items: {$ref: '#/components/schemas/Friend'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "최종 반환된 (friendsSince, studentId) 튜플에서 파생된 불투명 커서입니다. 더 이상 항목이 없으면 null입니다."}
    CreateFriendRequestRequest:
      type: object
      additionalProperties: false
      required: [studentId]
      description: "수신자만 지정하는 요청 페이로드입니다. 발신자는 항상 현재 인증 주체의 subjectId에서 가져옵니다."
      properties:
        studentId: {$ref: '#/components/schemas/Uuid', description: "친구 요청을 받을 같은 학원의 현재 학생 UUID입니다."}
    FriendRequest:
      type: object
      additionalProperties: false
      required: [friendRequestId, counterpart, status, createdAt, processedAt]
      description: "개인정보를 최소화한 친구 요청 프로젝션입니다. 상대방은 보낸 요청 결과에서는 수신자이고 받은 요청 결과에서는 발신자입니다."
      properties:
        friendRequestId: {$ref: '#/components/schemas/Uuid', description: "이 친구 요청의 안정적인 UUID입니다."}
        counterpart: {$ref: '#/components/schemas/StudentSummary', description: "보낸 요청 결과에서는 수신자이고 받은 요청 결과에서는 발신자입니다. 별도의 소유권 식별자는 노출하지 않습니다."}
        status: {$ref: '#/components/schemas/FriendRequestStatus', description: "친구 요청의 현재 수명 주기 상태입니다."}
        createdAt: {$ref: '#/components/schemas/UtcInstant', description: "이 요청이 생성된 RFC 3339 UTC Z 시점입니다."}
        processedAt:
          description: "ACCEPTED, REJECTED, CANCELED 상태로 처리된 RFC 3339 UTC Z 시점입니다. PENDING 상태일 때만 null입니다."
          oneOf: [{$ref: '#/components/schemas/UtcInstant'}, {type: 'null'}]
      allOf:
        - oneOf:
            - properties:
                status: {const: PENDING, description: "아직 처리되지 않은 요청 분기를 식별하며 반드시 PENDING입니다."}
                processedAt: {type: 'null', description: "상태가 PENDING인 동안 반드시 null입니다."}
            - properties:
                status: {enum: [ACCEPTED, REJECTED, CANCELED], description: "처리 완료된 요청 분기를 식별하는 종결 상태입니다."}
                processedAt: {$ref: '#/components/schemas/UtcInstant', description: "모든 종결 상태 요청에는 처리 시점이 반드시 있어야 합니다."}
    FriendRequestPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "인증된 학생이 소유한 PENDING 요청이며 createdAt DESC, friendRequestId DESC 순으로 정렬합니다."
          type: array
          items: {$ref: '#/components/schemas/FriendRequest'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "최종 반환된 (createdAt, friendRequestId) 튜플에서 파생된 불투명 커서입니다. 더 이상 항목이 없으면 null입니다."}
    CreateStudentBlockRequest:
      type: object
      additionalProperties: false
      required: [studentId]
      description: "차단할 학생만 지정하는 요청 페이로드입니다. 차단 주체는 항상 현재 인증 주체의 subjectId에서 가져옵니다."
      properties:
        studentId: {$ref: '#/components/schemas/Uuid', description: "전역적으로 차단할 학생의 UUID입니다."}
    StudentBlock:
      type: object
      additionalProperties: false
      required: [studentId, nickname, blockedAt]
      properties:
        studentId: {$ref: '#/components/schemas/Uuid', description: "차단된 학생의 안정적인 UUID입니다."}
        nickname: {type: string, minLength: 1, maxLength: 80, description: "차단된 학생의 현재 닉네임이며 공백 문자열이 아닙니다."}
        blockedAt: {$ref: '#/components/schemas/UtcInstant', description: "현재 단방향 차단이 생성되거나 다시 생성된 RFC 3339 UTC Z 시점입니다."}
    StudentBlockPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "인증된 학생이 생성한 활성 블록으로, blockedAt 내림차순, studentId 내림차순으로 정렬됩니다."
          type: array
          items: {$ref: '#/components/schemas/StudentBlock'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "최종 반환된 (blockedAt, studentId) 튜플에서 파생된 불투명 커서입니다. 더 이상 항목이 없으면 null입니다."}
    CardBalanceAccount:
      oneOf:
        - $ref: '#/components/schemas/UnknownCardBalanceAccount'
        - $ref: '#/components/schemas/KnownCardBalanceAccount'
      discriminator:
        propertyName: balanceKnowledge
        mapping:
          UNKNOWN: '#/components/schemas/UnknownCardBalanceAccount'
          KNOWN: '#/components/schemas/KnownCardBalanceAccount'
    UnknownCardBalanceAccount:
      type: object
      additionalProperties: false
      required: [cardBalanceAccountId, academyId, balanceKnowledge, actualCardBalance, ledgerAvailableBalance, displayAvailableBalance, unresolvedShortage, balanceAdjustmentInProgress, lastRefreshStatus, lastRefreshedAt]
      properties:
        cardBalanceAccountId: {$ref: '#/components/schemas/Uuid', description: "학생 카드 잔액 계정의 안정적인 UUID입니다."}
        academyId: {$ref: '#/components/schemas/Uuid', description: "이 카드 잔액 계정이 속한 학원의 UUID입니다."}
        balanceKnowledge: {type: string, const: UNKNOWN, description: "UNKNOWN은 성공한 외부 잔액 관측이 한 번도 없음을 뜻합니다. null인 잔액 값을 절대 0으로 해석하면 안 됩니다."}
        actualCardBalance: {type: 'null', description: "성공한 외부 잔액 관측이 없으므로 항상 null입니다. null은 0 KRW가 아니라 알 수 없음을 뜻합니다."}
        ledgerAvailableBalance: {type: 'null', description: "실제 카드 잔액을 알기 전까지 항상 null입니다. 서비스가 임의의 0을 만들어 이 값을 계산하면 안 됩니다."}
        displayAvailableBalance: {type: 'null', description: "실제 카드 잔액을 알기 전까지 항상 null입니다. UI에서 0 KRW로 표시하면 안 됩니다."}
        unresolvedShortage: {type: 'null', description: "실제 카드 잔액을 알기 전까지 항상 null입니다. 부족액을 알 수 없는 것과 부족액이 없는 것은 다릅니다."}
        balanceAdjustmentInProgress: {type: boolean, const: false, description: "OPEN 잔액 조정 건에는 성공적인 잔액 관측이 필요하지만 UNKNOWN 계정에는 없기 때문에 항상 false입니다."}
        lastRefreshStatus:
          description: "성공한 관측이 생기기 전에 가장 최근 조회 시도가 실패했으면 FAILED입니다. 기록된 조회 시도가 없으면 null입니다."
          type: [string, 'null']
          enum: [FAILED, null]
        lastRefreshedAt:
          description: "성공한 관측이 없으므로 항상 null입니다. 실패한 시도 시점은 관측 이력에 따로 기록합니다."
          type: ['null']
    KnownCardBalanceAccount:
      type: object
      additionalProperties: false
      required: [cardBalanceAccountId, academyId, balanceKnowledge, actualCardBalance, ledgerAvailableBalance, displayAvailableBalance, unresolvedShortage, balanceAdjustmentInProgress, lastRefreshStatus, lastRefreshedAt]
      properties:
        cardBalanceAccountId: {$ref: '#/components/schemas/Uuid', description: "학생 카드 잔액 계정의 안정적인 UUID입니다."}
        academyId: {$ref: '#/components/schemas/Uuid', description: "이 카드 잔액 계정이 속한 학원의 UUID입니다."}
        balanceKnowledge: {type: string, const: KNOWN, description: "KNOWN은 성공한 외부 잔액 관측이 하나 이상 있고 그 관측에서 반환 잔액 값을 얻었음을 뜻합니다."}
        actualCardBalance: {$ref: '#/components/schemas/KrwNonNegative', description: "가장 최근에 성공한 외부 카드 잔액 조회에서 관측된 음수가 아닌 정수 KRW입니다."}
        ledgerAvailableBalance: {$ref: '#/components/schemas/KrwSigned', description: "부호 있는 정수 KRW는 actualCardBalance에서 활성 위시가 보유한 총계를 뺀 것과 같습니다. 음수 값이 유지됩니다."}
        displayAvailableBalance: {$ref: '#/components/schemas/KrwNonNegative', description: "화면 표시용 음수 아닌 정수 KRW이며 max(0, ledgerAvailableBalance)와 같습니다."}
        unresolvedShortage: {$ref: '#/components/schemas/KrwNonNegative', description: "음수가 아닌 정수 KRW는 max(0, -ledgerAvailableBalance)와 같습니다. 0은 해결되지 않은 부족이 없음을 의미합니다."}
        balanceAdjustmentInProgress: {type: boolean, description: "응답 조회 시점에 계정 범위 잔액 조정 건이 OPEN일 때만 true입니다. RESOLVED 이력만 있는 경우를 포함해 OPEN 건이 없으면 false입니다. 계정에 저장하지 않고 파생하는 이 플래그와 잔액 필드는 하나의 일관된 계정 프로젝션에서 가져옵니다. 이후 조회가 실패하면 가장 최근에 성공한 금액은 유지하되 이 플래그는 현재 잔액 조정 건 상태를 반영합니다."}
        lastRefreshStatus: {type: string, enum: [SUCCESS, FAILED], description: "가장 최근 조회 시도의 결과입니다. FAILED는 이전의 성공적인 관측에서 보존된 금액과 공존할 수 있습니다."}
        lastRefreshedAt: {$ref: '#/components/schemas/UtcInstant', description: "반환 금액의 근거가 된 성공 관측의 RFC 3339 UTC Z 시점입니다. 이후 조회가 실패해도 이 값을 유지합니다."}
    CardBalanceAccountPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "이 페이지에서 인증된 학생이 볼 수 있는 카드 잔액 계정입니다."
          type: array
          items: {$ref: '#/components/schemas/CardBalanceAccount'}
        nextCursor:
          description: "다음 계정 페이지에 대한 불투명 커서. 추가 페이지가 없으면 null입니다."
          type: [string, 'null']
          minLength: 1
    BalanceRefreshResult:
      type: object
      additionalProperties: false
      required: [observationId, lookupMethod, observedAt, account]
      properties:
        observationId: {$ref: '#/components/schemas/Uuid', description: "새로 저장된 성공 잔액 관측의 UUID입니다."}
        lookupMethod:
          description: "이 공개 본문 없는 작업은 사용자가 요청한 조회를 수행하고 클라이언트가 선택한 방법을 허용하지 않으므로 항상 USER_REQUESTED입니다."
          type: string
          const: USER_REQUESTED
        observedAt: {$ref: '#/components/schemas/UtcInstant', description: "이 외부 잔액 조회를 시도한 RFC 3339 UTC Z 시점입니다."}
        account: {$ref: '#/components/schemas/KnownCardBalanceAccount', description: "이 성공 관측에서 파생한 갱신된 KNOWN 카드 잔액 계정 스냅샷입니다."}
    CardBalanceChange:
      type: object
      additionalProperties: false
      required: [eventId, eventType, observationId, lookupMethod, occurredAt, actualCardBalanceDelta, actualCardBalanceAfter, correctionOfEventId, balanceAdjustment]
      properties:
        eventId: {$ref: '#/components/schemas/Uuid', description: "불변 CARD_BALANCE_CHANGE 원장 이벤트의 UUID입니다. 계정 자금 이동 이력에서도 같은 값으로 이 사실을 식별합니다."}
        eventType: {type: string, const: CARD_BALANCE_CHANGE, description: "실패한 관측과 성공했지만 변동액이 0인 관측은 금액 이력 이벤트를 만들지 않으므로 항상 CARD_BALANCE_CHANGE입니다."}
        observationId: {$ref: '#/components/schemas/Uuid', description: "이 불변 이벤트에 정확히 연결된 성공 외부 잔액 관측의 UUID입니다."}
        lookupMethod: {$ref: '#/components/schemas/BalanceLookupMethod', description: "이 조회에 대한 트리거: USER_REQUESTED, PRE_DEPOSIT 또는 AUTO_DAILY."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "연결된 성공 관측의 observedAt과 같은 RFC 3339 UTC Z 시점입니다."}
        actualCardBalanceDelta:
          description: "이전에 성공적으로 관측한 잔액을 기준으로 한 0 아닌 부호 있는 정수 KRW 변동액입니다. 첫 성공 관측은 0을 기준으로 계산합니다."
          allOf:
            - $ref: '#/components/schemas/KrwSigned'
            - not: {const: 0}
        actualCardBalanceAfter: {$ref: '#/components/schemas/KrwNonNegative', description: "이 성공적인 조회로 관측된 음수가 아닌 정수 KRW입니다."}
        correctionOfEventId: {type: [string, 'null'], format: uuid, description: "이 새 이벤트가 보상하는 동일 계정의 이전 불변 이벤트 UUID입니다. 보정 이벤트가 아니면 null이며 이전 이벤트 자체는 바꾸지 않습니다."}
        balanceAdjustment:
          description: "이 원장 이벤트와 잔액 조정 건을 연결하는 불변 출처 정보입니다. 이벤트가 잔액 조정 건에 연결되지 않았으면 null입니다."
          oneOf:
            - $ref: '#/components/schemas/BalanceAdjustmentEventReference'
            - type: 'null'
    CardBalanceChangePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "변동액이 0 아닌 불변 CARD_BALANCE_CHANGE 이벤트를 occurredAt DESC, eventId DESC 순으로 반환합니다. 실패한 관측과 변동액이 0인 관측은 제외합니다."
          type: array
          items: {$ref: '#/components/schemas/CardBalanceChange'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "다른 항목이 존재할 때 최종 반환된 (occurredAt, eventId) 튜플에서 파생된 불투명 커서입니다. 빈 페이지와 종결 상태 페이지의 경우 null입니다."}
    Wish:
      type: object
      additionalProperties: false
      required: [id, cardBalanceAccountId, purpose, targetAmount, amount, abandonmentAmount, targetDate, state, visibility, balanceAdjustmentInProgress, createdAt, updatedAt, completedAt, closedAt, actualDurationSeconds, version]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "이 위시의 안정적인 UUID입니다."}
        cardBalanceAccountId: {$ref: '#/components/schemas/Uuid', description: "이 위시가 영구적으로 연결된 소유자의 카드 잔액 계정 UUID입니다."}
        purpose: {$ref: '#/components/schemas/Purpose', description: "이 위시에 저장된, NFC로 정규화되고 앞뒤 경계 공백이 없는 목적 텍스트입니다."}
        targetAmount: {$ref: '#/components/schemas/KrwPositive', description: "이 위시에 대한 양의 정수 KRW 목표입니다."}
        amount: {$ref: '#/components/schemas/KrwNonNegative', description: "현재 이 위시에 할당된 음수가 아닌 정수 KRW입니다. 실제 카드 잔액과 다르며 targetAmount를 초과하지 않습니다."}
        abandonmentAmount:
          description: "성공적으로 포기하기 직전에 이 위시에 할당되어 있던 불변의 소유자 전용 금액입니다. ABANDONED에서는 0을 포함해 targetAmount 이하의 정확한 정수 KRW이고, IN_PROGRESS, AMOUNT_REACHED, COMPLETED에서는 명시적인 null입니다. 현재 할당액, 실제 카드 잔액, 반환 합계, targetAmount 또는 삭제 값이 아닙니다. 포기 후 논리 삭제와 멱등 재생에서도 최초 값을 그대로 보존합니다."
          oneOf:
            - $ref: '#/components/schemas/KrwNonNegative'
            - type: 'null'
        targetDate:
          type: [string, 'null']
          format: date
          description: "과거, 현재 또는 미래일 수 있는 선택적 달력 날짜입니다."
        state: {$ref: '#/components/schemas/WishState', description: "수명 주기 상태입니다. 목표 미만은 IN_PROGRESS, 목표에 도달했지만 명시적으로 완료하기 전은 AMOUNT_REACHED, 완료 후는 COMPLETED, 포기 후는 ABANDONED입니다."}
        visibility: {$ref: '#/components/schemas/WishVisibility', description: "요청된 게시 범위 PRIVATE, FRIENDS 또는 ACADEMY; 현재 관계 및 차단 확인으로 인해 공유 카드가 더 숨겨질 수 있습니다."}
        balanceAdjustmentInProgress: {type: boolean, description: "이 위시의 카드 잔액 계정에 응답 스냅샷 기준 OPEN 잔액 조정 건이 있을 때만 true입니다. 이 값은 파생 값이며 위시나 공유 카드에 저장되지 않습니다. 목록·상세 응답은 조회 시점 값을, 변경 응답은 변경이 커밋된 후의 값을 반영합니다. 잔액 조정 건을 열거나 해결해도 위시의 version이나 updatedAt은 증가하지 않습니다. 이 프로젝션은 이 boolean 값만 노출하며 부족액, adjustmentCaseId, observationId, 이벤트 링크 또는 계정 이력은 절대 노출하지 않습니다."}
        createdAt: {$ref: '#/components/schemas/UtcInstant', description: "위시가 생성된 RFC 3339 UTC Z 시점입니다."}
        updatedAt: {$ref: '#/components/schemas/UtcInstant', description: "가장 최근에 성공한 위시 콘텐츠 또는 수명 주기 변경의 RFC 3339 UTC Z 시점입니다."}
        completedAt: {type: [string, 'null'], format: date-time, pattern: 'Z$', description: "COMPLETED 위시를 명시적으로 완료한 RFC 3339 UTC Z 시점입니다. 다른 모든 상태에서는 null입니다."}
        closedAt: {type: [string, 'null'], format: date-time, pattern: 'Z$', description: "수명 주기 종료의 RFC 3339 UTC Z 시점입니다. COMPLETED에서는 completedAt과 정확히 같고, ABANDONED에서는 내부에 영속된 abandonedAt과 같으며, IN_PROGRESS와 AMOUNT_REACHED에서는 null입니다. targetDate, updatedAt, 논리 삭제 시각과 무관합니다."}
        actualDurationSeconds:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: "완료된 위시의 경우 createdAt부터 completedAt까지 경과된 전체 초입니다. 그렇지 않으면 null입니다."
        version: {$ref: '#/components/schemas/WishVersion', description: "이 스냅샷의 음수 아닌 낙관적 동시성 버전입니다. 상태를 바꾸는 변경이 성공하면 증가하고 멱등 재생은 최초 값을 반환합니다."}
    WishPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "삭제되지 않은 소유 위시는 createdAt 내림차순, ID 내림차순입니다."
          type: array
          items: {$ref: '#/components/schemas/Wish'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "다음 위시 페이지에 대한 불투명 커서; 추가 페이지가 없으면 null입니다."}
    CreateWishRequest:
      type: object
      additionalProperties: false
      required: [purpose, targetAmount]
      properties:
        purpose: {$ref: '#/components/schemas/PurposeInput'}
        targetAmount: {$ref: '#/components/schemas/KrwPositive'}
        targetDate: {type: [string, 'null'], format: date}
    RepresentativeWishSelectionRequest:
      type: object
      additionalProperties: false
      required: [wishId]
      properties:
        wishId: {$ref: '#/components/schemas/Uuid', description: "이 카드 잔액 계정에서 대표로 선택할, 삭제되지 않은 활성 위시의 UUID입니다."}
    WishMergePatch:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {$ref: '#/components/schemas/WishVersion'}
        purpose: {$ref: '#/components/schemas/PurposeInput'}
        targetAmount: {$ref: '#/components/schemas/KrwPositive'}
        targetDate: {type: [string, 'null'], format: date}
        visibility: {$ref: '#/components/schemas/WishVisibility'}
      anyOf:
        - required: [purpose]
        - required: [targetAmount]
        - required: [targetDate]
        - required: [visibility]
    WishAmountCommand:
      type: object
      additionalProperties: false
      required: [amount, expectedVersion]
      properties:
        amount: {$ref: '#/components/schemas/KrwPositive'}
        expectedVersion: {$ref: '#/components/schemas/WishVersion'}
    WishVersionCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {$ref: '#/components/schemas/WishVersion'}
    WishTransferRequest:
      type: object
      additionalProperties: false
      required: [sourceWishId, destinationWishId, amount, sourceExpectedVersion, destinationExpectedVersion]
      properties:
        sourceWishId: {$ref: '#/components/schemas/Uuid'}
        destinationWishId: {$ref: '#/components/schemas/Uuid'}
        amount: {$ref: '#/components/schemas/KrwPositive'}
        sourceExpectedVersion: {$ref: '#/components/schemas/WishVersion'}
        destinationExpectedVersion: {$ref: '#/components/schemas/WishVersion'}
    WishMutationResult:
      type: object
      additionalProperties: false
      required: [wish, eventId]
      properties:
        wish: {$ref: '#/components/schemas/Wish', description: "변경 후의 권위 있는 위시 스냅샷입니다. 동일 요청의 멱등 재생이면 최초 스냅샷을 반환합니다."}
        eventId: {type: [string, 'null'], format: uuid, description: "변경으로 생성된 불변 원장 이벤트의 UUID입니다. 변경이 자금을 이동하지 않아 원장 이벤트를 만들지 않았으면 null입니다."}
    WishTransferResult:
      type: object
      additionalProperties: false
      required: [sourceWish, destinationWish, eventId, occurredAt]
      properties:
        sourceWish: {$ref: '#/components/schemas/Wish', description: "원자적 이체 후의 권위 있는 출발 위시 스냅샷입니다."}
        destinationWish: {$ref: '#/components/schemas/Wish', description: "원자적 이체 후의 권위 있는 도착 위시 스냅샷입니다."}
        eventId: {$ref: '#/components/schemas/Uuid', description: "두 이체 효과를 모두 포함하는 하나의 불변 원장 이벤트 UUID입니다."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "이체의 출발·도착 효과가 공유하는 RFC 3339 UTC Z 시점입니다."}
    BalanceAdjustmentEventReference:
      type: object
      description: "원장 이벤트와 잔액 조정 건을 연결하는 불변 출처 정보이며 잔액 조정 건의 변경 가능한 현재 상태가 아닙니다. 관측에만 존재하는 최초 성공 불일치 사실은 이력 항목을 만들지 않습니다. 부족액, 알림 상태, 관련 없는 관측 데이터는 여기서 노출하지 않습니다."
      additionalProperties: false
      required: [adjustmentCaseId, eventRole, sequenceNumber]
      properties:
        adjustmentCaseId: {$ref: '#/components/schemas/Uuid', description: "이 불변 원장 이벤트에 연결된 잔액 조정 건의 UUID입니다."}
        eventRole: {type: string, enum: [OPENING_DECREASE, INTERMEDIATE, RESOLUTION], description: "잔액 조정 건 내에서 이 이벤트의 불변 역할: 개시 감소, 중간 보상 또는 해결."}
        sequenceNumber: {type: integer, minimum: 0, description: "잔액 조정 건 내부에서 이 이벤트 링크의 0 기반 불변 순서입니다."}
    WishHistoryReference:
      type: object
      additionalProperties: false
      required: [wishId, wishPurposeSnapshot, deletedWish, detailAvailable]
      allOf:
        - if:
            properties:
              deletedWish: {const: true}
          then:
            properties:
              detailAvailable: {const: false}
      properties:
        wishId: {$ref: '#/components/schemas/Uuid', description: "이 계정 단위 이벤트에서 참조하는 위시의 안정적인 UUID입니다."}
        wishPurposeSnapshot: {$ref: '#/components/schemas/Purpose', description: "이벤트가 발생했을 때 원장 위시 효과에 의해 포착된 불변의 위시 목적입니다."}
        deletedWish: {type: boolean, description: "응답 조회 시점에 참조된 위시가 논리 삭제 상태이면 true입니다."}
        detailAvailable: {type: boolean, description: "현재 일반 위시 세부정보 탐색을 사용할 수 있는지 여부 deletedWish가 true이면 항상 false입니다. URL 또는 경로가 내보내지지 않습니다."}
    WishHistorySubject:
      type: object
      additionalProperties: false
      required: [wishId, displayPurpose, deletedWish, detailAvailable]
      allOf:
        - if:
            properties:
              deletedWish: {const: true}
          then:
            properties:
              detailAvailable: {const: false}
          else:
            properties:
              detailAvailable: {const: true}
      properties:
        wishId: {$ref: '#/components/schemas/Uuid', description: "불변 내역이 반환되는 소유 위시의 안정적인 UUID입니다."}
        displayPurpose: {$ref: '#/components/schemas/Purpose', description: "활성 위시의 현재 목적 또는 삭제된 위시에 대한 논리 삭제 직전에 캡처된 목적 스냅샷입니다."}
        deletedWish: {type: boolean, description: "응답 조회 시점에 이 소유 위시가 논리 삭제 상태이면 true입니다."}
        detailAvailable: {type: boolean, description: "deletedWish의 정확한 논리적 부정입니다. false이면 논리 삭제된 위시의 일반 상세 화면으로 이동할 수 없습니다. URL이나 경로는 반환하지 않습니다."}
    AccountFundMovement:
      oneOf:
        - $ref: '#/components/schemas/AccountCardBalanceChange'
        - $ref: '#/components/schemas/AccountWishDeposit'
        - $ref: '#/components/schemas/AccountWishWithdrawal'
        - $ref: '#/components/schemas/AccountWishTransfer'
        - $ref: '#/components/schemas/AccountWishCompletionReturn'
        - $ref: '#/components/schemas/AccountWishAbandonmentReturn'
        - $ref: '#/components/schemas/AccountWishDeletionReturn'
      discriminator:
        propertyName: eventType
        mapping:
          CARD_BALANCE_CHANGE: '#/components/schemas/AccountCardBalanceChange'
          WISH_DEPOSIT: '#/components/schemas/AccountWishDeposit'
          WISH_WITHDRAWAL: '#/components/schemas/AccountWishWithdrawal'
          WISH_TRANSFER: '#/components/schemas/AccountWishTransfer'
          WISH_COMPLETION_RETURN: '#/components/schemas/AccountWishCompletionReturn'
          WISH_ABANDONMENT_RETURN: '#/components/schemas/AccountWishAbandonmentReturn'
          WISH_DELETION_RETURN: '#/components/schemas/AccountWishDeletionReturn'
    AccountCardBalanceChange:
      type: object
      additionalProperties: false
      required: [eventId, eventType, observationId, lookupMethod, occurredAt, actualCardBalanceDelta, actualCardBalanceAfter, accountAvailableBalanceDelta, accountAvailableBalanceAfter, correctionOfEventId, balanceAdjustment]
      properties:
        eventId: {$ref: '#/components/schemas/Uuid', description: "이 불변의 CARD_BALANCE_CHANGE 이벤트의 UUID; 해당 CardBalanceChange eventId와 동일합니다."}
        eventType: {type: string, const: CARD_BALANCE_CHANGE, description: "항상 CARD_BALANCE_CHANGE, 0이 아닌 성공적인 외부 카드 잔액 변경을 식별합니다."}
        observationId: {$ref: '#/components/schemas/Uuid', description: "이 이벤트와 연결된 정확한 성공적인 잔액 관측의 UUID입니다."}
        lookupMethod: {$ref: '#/components/schemas/BalanceLookupMethod', description: "연결된 관측에 대한 트리거: USER_REQUESTED, PRE_DEPOSIT 또는 AUTO_DAILY."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 시점는 연결된 관측의 observedAt 값과 같습니다."}
        actualCardBalanceDelta:
          description: "0이 아닌 부호 있는 정수 KRW 외부 카드 잔액 변경."
          allOf: [{$ref: '#/components/schemas/KrwSigned'}, {not: {const: 0}}]
        actualCardBalanceAfter: {$ref: '#/components/schemas/KrwNonNegative', description: "이 외부 변경 후에 관측된 음수가 아닌 정수 KRW입니다."}
        accountAvailableBalanceDelta: {$ref: '#/components/schemas/KrwSigned', description: "부호 있는 원장 기준 가용 계정 잔액 변경은 actualCardBalanceDelta와 정확히 동일합니다."}
        accountAvailableBalanceAfter: {$ref: '#/components/schemas/KrwSigned', description: "이벤트 직후 부호 있는 원장 기준 가용 계정 잔액 음수 값은 유지되며 표시가 고정되지 않습니다."}
        correctionOfEventId: {type: [string, 'null'], format: uuid, description: "이 새 이벤트가 보상하는 이전의 불변 동일 계정 이벤트이며, 보상 대상이 없으면 null입니다. 이전 이벤트는 변경되지 않습니다."}
        balanceAdjustment:
          description: "잔액 조정 건과 연결된 불변 이벤트 출처 정보이며, 연결된 잔액 조정 건이 없으면 null입니다."
          oneOf: [{$ref: '#/components/schemas/BalanceAdjustmentEventReference'}, {type: 'null'}]
    AccountWishDeposit:
      type: object
      additionalProperties: false
      required: [eventId, eventType, wish, occurredAt, accountAvailableBalanceDelta, accountAvailableBalanceAfter, correctionOfEventId, balanceAdjustment]
      properties:
        eventId: {$ref: '#/components/schemas/Uuid', description: "불변 원장 이벤트의 UUID는 해당 위시 입금 프로젝션과 공유됩니다."}
        eventType: {type: string, const: WISH_DEPOSIT, description: "항상 WISH_DEPOSIT, 계정 가용 잔액에서 하나의 위시에 할당된 자금을 식별합니다."}
        wish: {$ref: '#/components/schemas/WishHistoryReference', description: "자금을 받은 위시에 대한 이벤트 시점 목적 및 조회 시점 논리 삭제 맥락입니다."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "이 불변 입금 이벤트가 발생한 RFC 3339 UTC Z 시점입니다."}
        accountAvailableBalanceDelta:
          description: "이번 입금으로 인해 음수 KRW 원장 기준 가용 계정 잔액이 변경되었습니다."
          allOf: [{$ref: '#/components/schemas/KrwSigned'}, {maximum: -1}]
        accountAvailableBalanceAfter: {$ref: '#/components/schemas/KrwSigned', description: "입금 후 즉시 부호 있는 원장 기준 가용 계정 잔액입니다."}
        correctionOfEventId: {type: [string, 'null'], format: uuid, description: "이 새 이벤트가 보상하는 이전의 불변 동일 계정 이벤트이며, 보상 대상이 없으면 null입니다."}
        balanceAdjustment:
          description: "잔액 조정 건과 연결된 불변 이벤트 출처 정보이며, 연결된 잔액 조정 건이 없으면 null입니다."
          oneOf: [{$ref: '#/components/schemas/BalanceAdjustmentEventReference'}, {type: 'null'}]
    AccountWishWithdrawal:
      type: object
      additionalProperties: false
      required: [eventId, eventType, wish, occurredAt, accountAvailableBalanceDelta, accountAvailableBalanceAfter, correctionOfEventId, balanceAdjustment]
      properties:
        eventId: {$ref: '#/components/schemas/Uuid', description: "해당 위시 출금 프로젝션과 공유되는 불변 원장 이벤트의 UUID."}
