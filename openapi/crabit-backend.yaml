      properties:
        eventId: {$ref: '#/components/schemas/Uuid', description: "계정 단위 입금 프로젝션과 공유되는 불변 원장 이벤트의 UUID입니다."}
        eventType: {type: string, const: WISH_DEPOSIT, description: "항상 WISH_DEPOSIT, 이 위시에 추가된 자금을 식별합니다."}
