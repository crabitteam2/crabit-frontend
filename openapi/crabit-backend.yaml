        eventId: {$ref: '#/components/schemas/Uuid', description: "계정 단위 포기 반환 프로젝션과 공유되는 불변 원장 이벤트의 UUID."}
        eventType: {type: string, const: WISH_ABANDONMENT_RETURN, description: "항상 WISH_ABANDONMENT_RETURN, 포기 중에 제거된 0이 아닌 자금을 식별합니다."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "포기 과정에서 위시 자금을 반환한 RFC 3339 UTC Z 시점입니다."}
        wishPurposeSnapshot: {$ref: '#/components/schemas/Purpose', description: "포기가 발생했을 때 원장 효과에 의해 이 위시에 대해 포착된 불변의 목적입니다."}
        wishAmountDelta:
          description: "이 위시에서 반환된 음수 정수 KRW입니다. 반환액이 0이면 이벤트나 이력 항목을 만들지 않습니다."
          allOf: [{$ref: '#/components/schemas/KrwSigned'}, {maximum: -1}]
        wishAmountAfter: {type: integer, const: 0, description: "포기한 후에는 항상 0 KRW입니다."}
        correctionOfEventId: {type: [string, 'null'], format: uuid, description: "이 새 이벤트가 보상하는 이전의 불변 동일 계정 이벤트이며, 보상 대상이 없으면 null입니다."}
        balanceAdjustment:
          description: "잔액 조정 건과 연결된 불변 이벤트 출처 정보이며, 연결된 잔액 조정 건이 없으면 null입니다."
          oneOf: [{$ref: '#/components/schemas/BalanceAdjustmentEventReference'}, {type: 'null'}]
    WishDeletionReturnMovement:
