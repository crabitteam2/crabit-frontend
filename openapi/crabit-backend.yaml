        messageDailyPace: {type: string, minLength: 1, maxLength: 1000, description: "완료 월의 계정 전체 일평균 속도를 설명하는 문구입니다."}
        messageExpectedDate: {type: [string, "null"], minLength: 1, maxLength: 1000, description: "예상 완료일 또는 이미 달성한 상태를 설명하며 계산할 수 없으면 null입니다."}
        messageRequiredDaily: {type: [string, "null"], minLength: 1, maxLength: 1000, description: "목표일까지 필요한 추가 일평균 저축액을 설명하며 계산할 수 없으면 null입니다."}
