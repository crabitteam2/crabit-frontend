          $ref: "#/components/schemas/Uuid"
          description: "최초 수락한 이벤트 UUID입니다."
        eventType:
          type: "string"
          description: "수락한 행동 유형입니다."
          enum:
            - "PROFILE_VISIT"
            - "FEED_EXPOSURE"
            - "FEED_CLICK"
