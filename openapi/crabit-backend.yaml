              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422': {$ref: '#/components/responses/InvalidVersion'}
        '503': {$ref: '#/components/responses/PhotoDeliveryUnavailable'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/wishes/{wishId}/fund-movements:
    parameters:
      - $ref: '#/components/parameters/CardBalanceAccountId'
      - $ref: '#/components/parameters/WishId'
    get:
      tags: [Wishes]
