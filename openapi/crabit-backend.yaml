  /v1/academies/{academyId}/shared-cards:
    parameters: [{$ref: '#/components/parameters/AcademyId'}]
    get:
      tags: [Shared Cards]
      operationId: listAcademySharedCards
      summary: "학원에서 현재 볼 수 있는 공유 카드 목록 조회"
      description: "조회할 때마다 학원 소속, 위시 visibility, 친구 관계, 양방향 차단을 다시 평가하고 소유자 본인은 제외합니다. photoId, object key, 과거 signed URL은 이 권한 검사를 대신하지 않습니다. PRIVATE 위시는 카드를 생성하지 않습니다. 첨부 사진이 하나라도 있으면 모든 항목의 새 5분 비공개 URL을 발급한 뒤에만 전체 페이지를 반환하며 signing 실패는 부분 페이지나 거짓 null 없이 503입니다. 임시 정렬은 contentUpdatedAt DESC, sharedCardId DESC 순입니다. 현재는 정렬 매개변수를 지원하지 않습니다. 이 임시 정책에서는 콘텐츠 또는 게시 상태가 바뀔 때만 카드 순서가 달라집니다. 친구 우선순위와 임베딩 기반 추천 정렬은 향후 계약에서 정할 사항이며 이 버전에서는 사용하지 않습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "현재 조회 가능한 진행 카드와 완료 카드입니다."
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedCardPage'}
              examples:
                progress-adjustment-false-page: {$ref: '#/components/examples/SharedProgressAdjustmentFalsePage'}
                progress-adjustment-true-page: {$ref: '#/components/examples/SharedProgressAdjustmentTruePage'}
                completion-page: {$ref: '#/components/examples/SharedCompletionPage'}
        '400': {$ref: '#/components/responses/MalformedRequest'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AcademyNotFound'}
        '503': {$ref: '#/components/responses/PhotoDeliveryUnavailable'}
  /v1/academies/{academyId}/shared-cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/AcademyId'
      - $ref: '#/components/parameters/SharedCardId'
    get:
      tags: [Shared Cards]
      operationId: getAcademySharedCard
      summary: "현재 볼 수 있는 공유 카드 조회"
      description: "소유자는 자신의 카드가 현재 공개 상태라면 조회할 수 있습니다. 다른 호출자는 현재 학원 소속, 위시 visibility, 친구 관계와 양방향 차단을 매번 다시 통과해야 하며 photoId나 과거 signed URL은 권한을 부여하지 않습니다. 사진이 있으면 새 5분 비공개 URL 세 개를 모두 발급한 뒤 반환하고 signing 실패는 거짓 null 없이 503입니다. 이미 발급된 URL은 접근이 철회되어도 최대 기존 5분 만료까지만 유효할 수 있고 새 URL은 발급하지 않습니다. 그 밖의 리소스 부재나 공개 범위 조건 위반은 모두 숨깁니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "현재 조회 가능한 공유 카드 한 건입니다."
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedCard'}
              examples:
                progress-adjustment-false: {$ref: '#/components/examples/SharedProgressAdjustmentFalse'}
                progress-adjustment-true: {$ref: '#/components/examples/SharedProgressAdjustmentTrue'}
                completion: {$ref: '#/components/examples/SharedCompletion'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SharedCardOrAcademyNotFound'}
        '503': {$ref: '#/components/responses/PhotoDeliveryUnavailable'}
  /v1/academies/{academyId}/students:
    parameters: [{$ref: '#/components/parameters/AcademyId'}]
    get:
      tags: [Friend Management]
      operationId: searchAcademyStudents
      summary: "닉네임으로 현재 같은 학원 학생 검색"
      description: "저장된 NFC 정규화 닉네임을 대상으로 대소문자를 구분하는 연속 유니코드 코드 포인트 부분 문자열을 검색해 인증된 학생과 같은 학원의 현재 구성원을 찾습니다. 인증된 학생 본인, 현재 구성원이 아닌 학생, 어느 방향으로든 활성 차단이 있는 후보는 제외합니다. 각 결과에는 NONE, FRIEND, OUTGOING_PENDING, INCOMING_PENDING 중 정확히 하나의 현재 관계 상태를 계산합니다. 결과는 nickname ASC, studentId ASC 순으로 정렬합니다. 불투명 커서는 이 작업, 인증된 학생, 학원, 정렬 버전, 정규화된 닉네임 필터, 마지막 정렬 튜플에 바인딩됩니다. 형식이 잘못되었거나 작업·행위자·학원이 다르거나 필터가 일치하지 않는 커서는 부분 페이지 없이 400을 반환합니다. 다음 페이지는 마지막 튜플 직후부터 이어지며 유효한 커서에는 유효한 limit 값을 함께 사용할 수 있습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/NicknameSearch'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "현재 같은 학원에 속한 학생 검색 결과와 각 학생의 관계 상태입니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentRelationshipPage'}
              examples:
                relationship-states: {$ref: '#/components/examples/StudentRelationshipSearchPage'}
                empty-page: {$ref: '#/components/examples/EmptyStudentRelationshipPage'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendManagementAcademyNotFound'}
  /v1/academies/{academyId}/friends:
    parameters: [{$ref: '#/components/parameters/AcademyId'}]
    get:
      tags: [Friend Management]
      operationId: listAcademyFriends
      summary: "현재 같은 학원 친구 목록 조회"
      description: "상대방이 요청한 학원의 현재 회원인 인증된 학생의 현재 정식 친구 관계를 나열합니다. 결과는 friendsSince DESC, studentId DESC 순으로 정렬됩니다. 불투명 커서는 이 작업, 인증된 학생, 학원, 정렬 버전 및 최종 튜플에 바인딩됩니다. 형식이 잘못되었거나 일치하지 않는 커서는 부분 페이지 없이 400을 반환합니다. 연속은 엄격하게 최종 튜플 아래에 있으며 유효한 커서와 함께 유효한 제한을 사용할 수 있습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "현재 같은 학원에 속한 친구 관계입니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendPage'}
              examples:
                current-friends: {$ref: '#/components/examples/FriendPageExample'}
                empty-page: {$ref: '#/components/examples/EmptyFriendPage'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendManagementAcademyNotFound'}
  /v1/academies/{academyId}/friends/{studentId}:
    parameters:
      - $ref: '#/components/parameters/AcademyId'
      - $ref: '#/components/parameters/StudentId'
    delete:
      tags: [Friend Management]
      operationId: unfriendAcademyStudent
      summary: "현재 같은 학원 친구 관계 종료"
      description: "인증된 학생과 요청한 학원의 대상 학생 사이에 현재 맺어진 친구 관계를 종료합니다. 관계가 없거나 이미 종료되었거나, 학원 구성원이 아니거나, 인증된 학생이 당사자가 아닌 경우는 FRIENDSHIP_NOT_FOUND로 숨깁니다. 이 작업은 과거 친구 요청을 다시 활성화하지 않으며 성공 응답 본문이 없습니다."
      security: [{SyntheticBearer: []}]
      responses:
        '204':
          description: "친구 관계가 종료되었습니다. 응답 본문은 없습니다."
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendshipOrAcademyNotFound'}
  /v1/academies/{academyId}/friend-requests:
    parameters: [{$ref: '#/components/parameters/AcademyId'}]
    post:
      tags: [Friend Management]
      operationId: sendFriendRequest
      summary: "친구 요청 보내기"
      description: "현재 인증 주체의 subjectId를 발신자로 하여 같은 학원의 현재 학생에게 PENDING 요청 하나를 생성합니다. 클라이언트 입력으로 발신자를 지정할 수 없습니다. 정규 학생 쌍 잠금 아래에서 어느 방향이든 활성 차단이 있으면 STUDENT_NOT_FOUND로 숨깁니다. 자기 자신, 현재 친구 관계, 같은 방향의 PENDING 요청, 반대 방향의 PENDING 요청은 각각 문서화된 충돌을 반환합니다. Idempotency-Key는 받지 않으며 재요청도 현재 상태를 기준으로 평가합니다."
      security: [{SyntheticBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFriendRequestRequest'}
      responses:
        '201':
          description: "PENDING 상태에서 친구 요청이 생성되었습니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequest'}
              examples:
                created: {$ref: '#/components/examples/FriendRequestCreated'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/StudentOrAcademyNotFound'}
        '409': {$ref: '#/components/responses/FriendRequestCreateConflict'}
  /v1/academies/{academyId}/friend-requests/sent:
    parameters: [{$ref: '#/components/parameters/AcademyId'}]
    get:
      tags: [Friend Management]
      operationId: listSentFriendRequests
      summary: "보낸 대기 중 친구 요청 목록 조회"
      description: "인증된 학생이 발신자인 현재 PENDING 요청만 반환합니다. 결과는 createdAt DESC, friendRequestId DESC 순으로 정렬합니다. 불투명 커서는 이 작업, 인증된 학생, 학원, 정렬 버전, 마지막 튜플에 바인딩됩니다. 형식이 잘못되었거나 바인딩이 일치하지 않는 커서는 부분 페이지 없이 400을 반환합니다. 다음 페이지는 마지막 튜플보다 엄격히 뒤에 이어지며 유효한 커서에는 유효한 limit 값을 함께 사용할 수 있습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "인증된 학생이 발신자로 소유한 PENDING 요청입니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequestPage'}
              examples:
                sent: {$ref: '#/components/examples/SentFriendRequestPage'}
                empty-page: {$ref: '#/components/examples/EmptyFriendRequestPage'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendManagementAcademyNotFound'}
  /v1/academies/{academyId}/friend-requests/received:
    parameters: [{$ref: '#/components/parameters/AcademyId'}]
    get:
      tags: [Friend Management]
      operationId: listReceivedFriendRequests
      summary: "받은 대기 중 친구 요청 목록 조회"
      description: "인증된 학생이 수신자인 현재 PENDING 요청만 반환합니다. 결과는 createdAt DESC, friendRequestId DESC 순으로 정렬합니다. 불투명 커서는 이 작업, 인증된 학생, 학원, 정렬 버전, 마지막 튜플에 바인딩됩니다. 형식이 잘못되었거나 바인딩이 일치하지 않는 커서는 부분 페이지 없이 400을 반환합니다. 다음 페이지는 마지막 튜플보다 엄격히 뒤에 이어지며 유효한 커서에는 유효한 limit 값을 함께 사용할 수 있습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "인증된 학생이 수신자로 소유한 PENDING 요청입니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequestPage'}
              examples:
                received: {$ref: '#/components/examples/ReceivedFriendRequestPage'}
                empty-page: {$ref: '#/components/examples/EmptyFriendRequestPage'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendManagementAcademyNotFound'}
  /v1/academies/{academyId}/friend-requests/{friendRequestId}:
    parameters:
      - $ref: '#/components/parameters/AcademyId'
      - $ref: '#/components/parameters/FriendRequestId'
    delete:
      tags: [Friend Management]
      operationId: cancelFriendRequest
      summary: "보낸 대기 중 친구 요청 취소"
      description: "보낸 사람으로서 인증된 학생이 소유한 PENDING 요청만 취소합니다. 보낸 사람이 소유하지 않거나 승인되지 않은 학원 외부 요청은 FRIEND_REQUEST_NOT_FOUND로 숨겨집니다. 처리된 소유 요청은 FRIEND_REQUEST_NOT_PENDING를 반환합니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "요청이 CANCELED 상태로 취소되고 processedAt에는 null이 아닌 값이 기록됩니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequest'}
              examples:
                canceled: {$ref: '#/components/examples/FriendRequestCanceled'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendRequestOrAcademyNotFound'}
        '409': {$ref: '#/components/responses/FriendRequestNotPending'}
  /v1/academies/{academyId}/friend-requests/{friendRequestId}/acceptance:
    parameters:
      - $ref: '#/components/parameters/AcademyId'
      - $ref: '#/components/parameters/FriendRequestId'
    post:
      tags: [Friend Management]
      operationId: acceptFriendRequest
      summary: "받은 대기 중 친구 요청 수락"
      description: "인증된 학생이 수신자로 소유한 PENDING 요청만 수락합니다. 정규 학생 쌍 잠금 아래에서 현재 학원 소속, 정확한 요청, 현재 친구 관계가 없음, 양방향 차단이 없음을 다시 확인합니다. 한 트랜잭션에서 요청을 ACCEPTED로 바꾸고 현재 친구 관계를 정확히 하나 생성하거나 재개합니다. 동시성 경쟁에서 실패한 요청은 문서화된 충돌을 반환합니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "요청이 수락되고 현재 친구 관계 하나가 맺어졌습니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Friend'}
              examples:
                accepted: {$ref: '#/components/examples/FriendAccepted'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendRequestOrAcademyNotFound'}
        '409': {$ref: '#/components/responses/FriendRequestAcceptanceConflict'}
  /v1/academies/{academyId}/friend-requests/{friendRequestId}/rejection:
    parameters:
      - $ref: '#/components/parameters/AcademyId'
      - $ref: '#/components/parameters/FriendRequestId'
    post:
      tags: [Friend Management]
      operationId: rejectFriendRequest
      summary: "받은 대기 중 친구 요청 거절"
      description: "인증된 학생이 수신자로 소유한 PENDING 요청만 거부합니다. 수신자 소유가 아닌 학원 외부 요청 또는 승인되지 않은 요청은 FRIEND_REQUEST_NOT_FOUND로 숨겨집니다. 처리된 소유 요청은 FRIEND_REQUEST_NOT_PENDING를 반환합니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "요청이 REJECTED 상태로 거절되고 processedAt에는 null이 아닌 값이 기록됩니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequest'}
              examples:
                rejected: {$ref: '#/components/examples/FriendRequestRejected'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendRequestOrAcademyNotFound'}
        '409': {$ref: '#/components/responses/FriendRequestNotPending'}
  /v1/me/student-blocks:
    get:
      tags: [Friend Management]
      operationId: listMyStudentBlocks
      summary: "인증된 학생이 설정한 활성 차단 목록 조회"
      description: "차단 주체가 현재 인증 주체의 subjectId인 활성 단방향 차단만 반환합니다. 결과는 blockedAt DESC, studentId DESC 순으로 정렬합니다. 불투명 커서는 이 작업, 인증된 학생, 정렬 버전, 마지막 튜플에 바인딩됩니다. 형식이 잘못되었거나 바인딩이 일치하지 않는 커서는 부분 페이지 없이 400을 반환합니다. 다음 페이지는 마지막 튜플보다 엄격히 뒤에 이어지며 유효한 커서에는 유효한 limit 값을 함께 사용할 수 있습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "인증된 학생이 생성한 활성 블록입니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentBlockPage'}
              examples:
                active-blocks: {$ref: '#/components/examples/StudentBlockPageExample'}
                empty-page: {$ref: '#/components/examples/EmptyStudentBlockPage'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
    post:
      tags: [Friend Management]
      operationId: blockStudent
      summary: "학생을 전체 범위에서 차단"
      description: "인증된 학생의 단방향 전역 차단을 생성하거나 다시 생성합니다. 클라이언트 입력으로 차단 주체를 지정할 수 없습니다. 정규 학생 쌍 잠금 아래에서 모든 학원의 현재 친구 관계를 종료하고, 모든 학원에서 양방향의 PENDING 요청을 processedAt이 설정된 CANCELED로 바꾸며, 같은 트랜잭션에서 차단을 활성화합니다. 재요청은 현재 상태를 기준으로 평가하며 Idempotency-Key는 받지 않습니다."
      security: [{SyntheticBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateStudentBlockRequest'}
      responses:
        '201':
          description: "단방향 전역 차단이 생성되거나 다시 생성되었습니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentBlock'}
              examples:
                created: {$ref: '#/components/examples/StudentBlockCreated'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/StudentNotFound'}
        '409': {$ref: '#/components/responses/StudentBlockConflict'}
  /v1/me/student-blocks/{studentId}:
    parameters: [{$ref: '#/components/parameters/StudentId'}]
    delete:
      tags: [Friend Management]
      operationId: unblockStudent
      summary: "단방향 학생 차단 해제"
      description: "차단 주체가 인증된 학생인 현재 차단만 해제합니다. 차단이 없거나 이미 해제되었거나 인증된 학생이 소유하지 않은 차단은 STUDENT_BLOCK_NOT_FOUND로 숨깁니다. 차단을 해제해도 친구 관계나 차단 과정에서 취소된 요청은 절대 복원하지 않으며 성공 응답 본문이 없습니다."
      security: [{SyntheticBearer: []}]
      responses:
        '204':
          description: "블록이 해제되었습니다. 응답에는 본문이 없습니다."
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/StudentBlockNotFound'}
components:
  securitySchemes:
    SyntheticBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-synthetic-token
      description: "불투명한 합성 인증 주체 토큰입니다. 알려진 토큰은 학생 또는 인증된 비학생 교직원 인증 주체를 식별합니다. 토큰 발급·갱신, 페르소나 선택, 테스트 픽스처 제어는 이 계약의 범위 밖입니다."
  parameters:
    CardBalanceAccountId:
      name: cardBalanceAccountId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    WishId:
      name: wishId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    WishPhotoId:
      name: photoId
      in: path
      required: true
      description: "Opaque 위시 사진 UUID입니다. 식별자 knowledge만으로 읽기, 취소 또는 첨부 권한이 생기지 않습니다."
      schema: {$ref: '#/components/schemas/Uuid'}
    AcademyId:
      name: academyId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SharedCardId:
      name: cardId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    StudentId:
      name: studentId
      in: path
      required: true
      description: "관계 상대방의 UUID입니다. 인증된 소유자 정보는 항상 현재 인증 주체에서 가져오며 이 매개변수로 받지 않습니다."
      schema: {$ref: '#/components/schemas/Uuid'}
    FriendRequestId:
      name: friendRequestId
      in: path
      required: true
      description: "친구 요청의 UUID입니다. 승인되지 않았거나 잘못된 역할 식별자는 FRIEND_REQUEST_NOT_FOUND로 정규화됩니다."
      schema: {$ref: '#/components/schemas/Uuid'}
    NicknameSearch:
      name: nickname
      in: query
      required: true
      description: "앞뒤의 유니코드 Space_Separator 코드 포인트를 반복해서 제거하고 NFC로 정규화한 뒤, Cc, Cf, Zl, Zp를 거부하며 1~80개의 유니코드 코드 포인트를 요구합니다. 저장된 NFC 정규화 닉네임에서 대소문자를 구분하는 연속 유니코드 코드 포인트 부분 문자열로 일치 여부를 판단합니다."
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: "이 API 작업의 고정 정렬 순서에 바인딩된 불투명 커서입니다."
      schema: {$ref: '#/components/schemas/Cursor'}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "학생별 영구 네임스페이스입니다. 동일한 작업, 대상, 정규화된 요청에만 키를 재사용할 수 있습니다."
      schema: {type: string, minLength: 1, maxLength: 200}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: "본문 없는 DELETE의 동시성 검사를 위한 정확한 음수 아닌 정수 위시 버전입니다. 값이 없거나 정수가 아니면 400, 디코딩된 값이 음수이면 422 INVALID_VERSION, 음수가 아니지만 최신 버전과 다르면 409 VERSION_CONFLICT를 반환합니다."
      schema: {$ref: '#/components/schemas/WishVersion'}
  headers:
    IdempotencyReplayed:
      description: "동일한 요청의 종결 성공 domain 결과가 재생되는 경우에만 true입니다. ACTIVE_PHOTO는 최초 결과의 정확한 photoId만 유지하고 ephemeral signed URL을 새로 발급하며, NO_PHOTO는 이후 현재 attachment와 무관하게 null을 유지합니다. PHOTO_REVOKED의 409 WISH_PHOTO_EXPIRED 또는 URL 발급 실패의 503 PHOTO_DELIVERY_UNAVAILABLE에는 이 header를 보내지 않습니다."
      schema: {type: boolean}
    CacheControlNoStore:
      description: "짧은 수명의 비공개 signed URL이 포함될 수 있으므로 JSON 응답을 저장하지 않습니다."
      required: true
      schema: {type: string, const: no-store}
    RetryAfter:
      description: "가장 이른 적용 quota 해제까지 기다릴 양의 정수 초입니다."
      required: true
      schema: {type: integer, minimum: 1}
  responses:
    WishMutationSuccess:
      description: "위시 변경이 완료되었습니다. 동일 요청 재생은 최초 domain snapshot identity·상태·event identity·occurrence time·version을 유지합니다. 최초 사진 상태가 NO_PHOTO이면 이후 현재 attachment를 조회하거나 대체하지 않고 photo null을 반환합니다. ACTIVE_PHOTO이면 인증 학생 소유이고 최초 snapshot의 정확한 위시에 ATTACHED인 같은 photoId를 재검증한 뒤 새 5분 URL만 발급합니다. PHOTO_REVOKED이면 이 성공 응답 대신 409 WISH_PHOTO_EXPIRED를 반환하고, 유효한 ACTIVE_PHOTO의 URL 발급만 실패하면 이 성공 응답 대신 503 PHOTO_DELIVERY_UNAVAILABLE을 반환합니다. Idempotency-Replayed는 성공 재생에만 true이고, 사진 응답 capability는 state-changing command가 commit하기 전에 발급되어야 합니다."
      headers:
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WishMutationResult'}
    MalformedRequest:
      description: "MALFORMED_REQUEST — 잘못된 형식의 JSON, 경로, 쿼리, 커서 또는 필수 동시성 구조(누락되거나 정수가 아닌 필수 버전 포함)."
      x-error-codes: [MALFORMED_REQUEST]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    MalformedOrIdempotencyRequired:
      description: "누락되거나 정수가 아닌 필수 버전을 포함하는 MALFORMED_REQUEST 또는 IDEMPOTENCY_KEY_REQUIRED."
      x-error-codes: [MALFORMED_REQUEST, IDEMPOTENCY_KEY_REQUIRED]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    DeletePreconditionRequired:
      description: "MALFORMED_REQUEST, EXPECTED_VERSION_REQUIRED 또는 IDEMPOTENCY_KEY_REQUIRED."
      x-error-codes: [MALFORMED_REQUEST, EXPECTED_VERSION_REQUIRED, IDEMPOTENCY_KEY_REQUIRED]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    AuthRequired:
      description: "AUTH_REQUIRED — Bearer 토큰이 없거나 유효하지 않습니다."
      x-error-codes: [AUTH_REQUIRED]
      headers:
        WWW-Authenticate:
          required: true
          schema: {type: string, const: Bearer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: "FORBIDDEN — 인증 주체가 학생이 아닙니다."
      x-error-codes: [FORBIDDEN]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    CardBalanceAccountNotFound:
      description: "CARD_BALANCE_ACCOUNT_NOT_FOUND — 계정이 없거나 종료되었거나, 인증된 학생이 소유하지 않거나, 다른 학원 소속인 경우를 숨깁니다."
      x-error-codes: [CARD_BALANCE_ACCOUNT_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    WishOrAccountNotFound:
      description: "CARD_BALANCE_ACCOUNT_NOT_FOUND 또는 WISH_NOT_FOUND — 리소스 부재, 비소유, 삭제, 그 밖의 숨김 상태를 나타냅니다."
      x-error-codes: [CARD_BALANCE_ACCOUNT_NOT_FOUND, WISH_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    CreateWishResourceNotFound:
      description: "CARD_BALANCE_ACCOUNT_NOT_FOUND 또는 WISH_PHOTO_NOT_FOUND — 계정 부재·비소유·학원 불일치와 사진 부재·다른 소유자를 각각 숨깁니다."
      x-error-codes: [CARD_BALANCE_ACCOUNT_NOT_FOUND, WISH_PHOTO_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    WishAccountOrPhotoNotFound:
      description: "CARD_BALANCE_ACCOUNT_NOT_FOUND, WISH_NOT_FOUND 또는 WISH_PHOTO_NOT_FOUND — 계정·위시·후보 사진의 부재나 비소유 상태를 리소스별 not-found로 숨깁니다."
      x-error-codes: [CARD_BALANCE_ACCOUNT_NOT_FOUND, WISH_NOT_FOUND, WISH_PHOTO_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    WishPhotoNotFound:
      description: "WISH_PHOTO_NOT_FOUND — 사진이 없거나 인증된 학생과 다른 소유자임을 구분하지 않습니다."
      x-error-codes: [WISH_PHOTO_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    WishHistoryOrAccountNotFound:
      description: "CARD_BALANCE_ACCOUNT_NOT_FOUND 또는 WISH_NOT_FOUND — 계정이 없거나 인증된 학생이 소유하지 않은 경우, 또는 위시가 없거나 다른 소유자의 것이거나 해당 계정에 속하지 않은 경우입니다. 소유자가 논리 삭제한 위시는 이력 전용 응답에서 의도적으로 숨기지 않으며 200을 반환합니다."
      x-error-codes: [CARD_BALANCE_ACCOUNT_NOT_FOUND, WISH_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    AcademyNotFound:
      description: "ACADEMY_NOT_FOUND — 존재하지 않거나 현재 보이지 않는 학원이 숨겨져 있습니다."
      x-error-codes: [ACADEMY_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    SharedCardOrAcademyNotFound:
      description: "ACADEMY_NOT_FOUND 또는 SHARED_CARD_NOT_FOUND — 리소스 부재나 현재 공개 범위 조건 위반을 숨깁니다."
      x-error-codes: [ACADEMY_NOT_FOUND, SHARED_CARD_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    CreateConflict:
      description: "BALANCE_MISMATCH_LOCKED, IDEMPOTENCY_KEY_REUSED, WISH_PHOTO_EXPIRED 또는 WISH_PHOTO_ALREADY_ATTACHED입니다. 일치하는 성공 결과의 멱등 재생을 현재 불일치 방어 조건보다 먼저 처리합니다. 캡처된 사진 상태가 식별자 없는 PHOTO_REVOKED이면 Wish 성공 본문, photoId, URL, Idempotency-Replayed 없이 WISH_PHOTO_EXPIRED입니다. 사진 첨부 실패는 위시를 생성하지 않습니다."
      x-error-codes: [BALANCE_MISMATCH_LOCKED, IDEMPOTENCY_KEY_REUSED, WISH_PHOTO_EXPIRED, WISH_PHOTO_ALREADY_ATTACHED]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            balance-mismatch-locked: {$ref: '#/components/examples/BalanceMismatchLocked'}
            photo-revoked-replay: {$ref: '#/components/examples/WishMutationPhotoRevokedReplay'}
    PatchConflict:
      description: "VERSION_CONFLICT, INVALID_STATE_TRANSITION, BALANCE_MISMATCH_LOCKED, WISH_PHOTO_EXPIRED 또는 WISH_PHOTO_ALREADY_ATTACHED. 사진 교체 실패는 기존 attachment와 후보 Pending 사진을 바꾸지 않습니다."
      x-error-codes: [VERSION_CONFLICT, INVALID_STATE_TRANSITION, BALANCE_MISMATCH_LOCKED, WISH_PHOTO_EXPIRED, WISH_PHOTO_ALREADY_ATTACHED]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    DeleteConflict:
      description: "VERSION_CONFLICT 또는 IDEMPOTENCY_KEY_REUSED. OPEN 잔액 불일치는 삭제를 차단하지 않습니다."
      x-error-codes: [VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    DepositConflict:
      description: "VERSION_CONFLICT, INVALID_STATE_TRANSITION, BALANCE_MISMATCH_LOCKED, INSUFFICIENT_AVAILABLE_BALANCE, TARGET_AMOUNT_EXCEEDED, IDEMPOTENCY_KEY_REUSED 또는 WISH_PHOTO_EXPIRED. 일치하는 성공 receipt의 사진 상태가 PHOTO_REVOKED이면 Wish 성공 본문과 photo capability 없이 WISH_PHOTO_EXPIRED입니다."
      x-error-codes: [VERSION_CONFLICT, INVALID_STATE_TRANSITION, BALANCE_MISMATCH_LOCKED, INSUFFICIENT_AVAILABLE_BALANCE, TARGET_AMOUNT_EXCEEDED, IDEMPOTENCY_KEY_REUSED, WISH_PHOTO_EXPIRED]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            balance-mismatch-locked: {$ref: '#/components/examples/BalanceMismatchLocked'}
            photo-revoked-replay: {$ref: '#/components/examples/WishMutationPhotoRevokedReplay'}
    WithdrawalConflict:
      description: "VERSION_CONFLICT, INVALID_STATE_TRANSITION, INSUFFICIENT_WISH_AMOUNT, IDEMPOTENCY_KEY_REUSED 또는 WISH_PHOTO_EXPIRED. 일치하는 성공 receipt의 사진 상태가 PHOTO_REVOKED이면 Wish 성공 본문과 photo capability 없이 WISH_PHOTO_EXPIRED입니다."
      x-error-codes: [VERSION_CONFLICT, INVALID_STATE_TRANSITION, INSUFFICIENT_WISH_AMOUNT, IDEMPOTENCY_KEY_REUSED, WISH_PHOTO_EXPIRED]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            photo-revoked-replay: {$ref: '#/components/examples/WishMutationPhotoRevokedReplay'}
    TransferConflict:
      description: "VERSION_CONFLICT, INVALID_STATE_TRANSITION, CROSS_ACCOUNT_TRANSFER_FORBIDDEN, INSUFFICIENT_WISH_AMOUNT, TARGET_AMOUNT_EXCEEDED, BALANCE_MISMATCH_LOCKED, IDEMPOTENCY_KEY_REUSED 또는 WISH_PHOTO_EXPIRED. 일치하는 이체 성공 receipt의 출발 또는 도착 사진 상태 중 하나라도 PHOTO_REVOKED이면 양쪽 URL을 발급하기 전에 전체 재생을 WISH_PHOTO_EXPIRED로 실패시키고 부분 본문을 반환하지 않습니다."
      x-error-codes: [VERSION_CONFLICT, INVALID_STATE_TRANSITION, CROSS_ACCOUNT_TRANSFER_FORBIDDEN, INSUFFICIENT_WISH_AMOUNT, TARGET_AMOUNT_EXCEEDED, BALANCE_MISMATCH_LOCKED, IDEMPOTENCY_KEY_REUSED, WISH_PHOTO_EXPIRED]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            either-side-photo-revoked: {$ref: '#/components/examples/WishTransferPhotoRevokedReplay'}
    StateMutationConflict:
      description: "VERSION_CONFLICT, INVALID_STATE_TRANSITION, IDEMPOTENCY_KEY_REUSED 또는 WISH_PHOTO_EXPIRED. 일치하는 완료·포기 성공 receipt의 사진 상태가 PHOTO_REVOKED이면 Wish 성공 본문과 photo capability 없이 WISH_PHOTO_EXPIRED입니다. OPEN 잔액 불일치는 완료 또는 포기를 차단하지 않습니다."
      x-error-codes: [VERSION_CONFLICT, INVALID_STATE_TRANSITION, IDEMPOTENCY_KEY_REUSED, WISH_PHOTO_EXPIRED]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
