      properties:
        topWeek: {type: [integer, "null"], minimum: 1, maximum: 5, description: "완료 월에서 유효 입금 합계가 가장 큰 1~5주차이며 입금이 없으면 null입니다."}
        topWeekday:
          type: [string, "null"]
          enum: ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "일요일", null]
          description: "완료 월에서 유효 입금 빈도가 가장 높은 요일이며 입금이 없으면 null입니다."
        messageWeekWeekday: {type: string, minLength: 1, maxLength: 1000, description: "최다 저축 주차와 요일 또는 데이터 부족을 설명하는 문구입니다."}
        messageRegularity: {type: string, minLength: 1, maxLength: 1000, description: "입금 날짜 간격으로 계산한 규칙성 안내 문구입니다."}
        messageAvgAmount: {type: string, minLength: 1, maxLength: 1000, description: "완료 월의 1회 평균 저축액을 설명하는 문구입니다."}
    MonthlyRecapGroupComparison:
      type: object
      additionalProperties: false
      required: [habitPercentile, habitPercentileStatus, achievementPercentile, achievementPercentileStatus, messageHabit, messageAchievement]
      properties:
        habitPercentile: {type: [integer, "null"], minimum: 1, maximum: 99, description: "habitPercentileStatus가 ok일 때의 1~99 백분위이며 나머지 상태에서는 null입니다."}
        habitPercentileStatus: {type: string, enum: [ok, no_peers, all_tied], description: "습관 비교값이 계산되었는지, peer가 없는지, 모두 동점인지 구분합니다."}
        achievementPercentile: {type: [integer, "null"], minimum: 1, maximum: 99, description: "achievementPercentileStatus가 ok일 때의 1~99 백분위이며 나머지 상태에서는 null입니다."}
        achievementPercentileStatus:
          type: [string, "null"]
          enum: [ok, no_peers, all_tied, null]
          description: "목표 달성 비교 결과이며 viewer의 대표 위시 달성값 자체가 없으면 null입니다."
        messageHabit: {type: string, minLength: 1, maxLength: 1000, description: "습관 백분위 상태에 대응하며 peer identity를 포함하지 않는 문구입니다."}
        messageAchievement: {type: [string, "null"], minLength: 1, maxLength: 1000, description: "목표 달성 백분위 상태 문구이며 viewer의 비교값이 없으면 null입니다."}
      allOf:
        - if:
            properties: {habitPercentileStatus: {const: ok}}
            required: [habitPercentileStatus]
          then:
            properties: {habitPercentile: {type: integer, minimum: 1, maximum: 99}}
          else:
            properties: {habitPercentile: {type: "null"}}
        - if:
            properties: {achievementPercentileStatus: {const: ok}}
            required: [achievementPercentileStatus]
          then:
            properties:
              achievementPercentile: {type: integer, minimum: 1, maximum: 99}
              messageAchievement: {type: string, minLength: 1}
        - if:
            properties: {achievementPercentileStatus: {enum: [no_peers, all_tied]}}
            required: [achievementPercentileStatus]
          then:
            properties:
              achievementPercentile: {type: "null"}
              messageAchievement: {type: string, minLength: 1}
        - if:
            properties: {achievementPercentileStatus: {type: "null"}}
            required: [achievementPercentileStatus]
          then:
            properties:
              achievementPercentile: {type: "null"}
              messageAchievement: {type: "null"}
