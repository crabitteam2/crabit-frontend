<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Crabit Frontend Documentation</title>
    <style>
      :root {
        font-family:
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        color: #333333;
        background: #fef6fa;
      }
      body {
        margin: 0;
      }
      main {
        box-sizing: border-box;
        width: min(100% - 32px, 720px);
        margin: 0 auto;
        padding: 80px 0;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 8vw, 52px);
        line-height: 1.1;
      }
      p {
        margin: 0 0 36px;
        color: #636363;
        line-height: 1.6;
      }
      nav {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
      a {
        display: block;
        padding: 24px;
        border: 1px solid #fbd0e4;
        border-radius: 20px;
        color: inherit;
        background: #ffffff;
        text-decoration: none;
        box-shadow: 0 8px 24px rgb(92 35 67 / 8%);
      }
      a:hover,
      a:focus-visible {
        border-color: #fb75bb;
        outline: none;
      }
      strong,
      span {
        display: block;
      }
      span {
        margin-top: 8px;
        color: #8f8f8f;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Crabit Frontend</h1>
      <p>컴포넌트 예시와 TypeScript API 문서를 한 곳에서 확인합니다.</p>
      <nav aria-label="개발 문서">
        <a href="__DOCS_BASE_PATH__storybook/">
          <strong>Storybook</strong>
          <span>실제 컴포넌트 상태와 브라우저 상호작용</span>
        </a>
        <a href="__DOCS_BASE_PATH__api/">
          <strong>TypeScript API</strong>
          <span>TSDoc에서 생성한 모듈·타입·동작 문서</span>
        </a>
      </nav>
    </main>
  </body>
</html>
